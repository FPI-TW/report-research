name: CI

# 這個 workflow 的存在理由：PR #92 與 #93 相隔 14 秒併入 main，兩邊都以
# 舊 main 為基準通過測試，卻在合併後才互相踩到（#93 為共用的 SELECT 常數
# 增欄，#92 的測試 fixture 沒跟上）。沒有 CI 時，「分支必須先更新」這個
# 分支保護規則只會強迫合併順序、不會有人重跑測試；要真的擋住語意衝突，
# 必須有一份在「分支＋最新 main」的合併結果上跑的測試。
#
# pull_request 事件跑的正是合併後的暫時 commit（不是分支頂端），這就是
# 這裡要的語意；再配合 main 的 require-branches-up-to-date，才形成閉環。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 這裡只跑測試，不需要寫入任何東西；預設的 token 是可寫的，收到唯讀。
permissions:
  contents: read

# 同一個 PR 連推多次時，取消尚未跑完的舊次（節省私有 repo 的 Actions 額度）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端測試（tsc + vitest）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: 型別檢查
        run: npm run typecheck

      # ESLint 有設定檔卻長期不在 CI 內，於是 react-hooks 那組規則（含
      # exhaustive-deps、set-state-in-effect）完全沒有守門。現況是 0 error /
      # 2 warning，所以直接當必要檢查，不需要 continue-on-error 過渡期。
      - name: ESLint
        run: npm run lint

      # `npm run build` 從來沒進過 CI，而 typecheck 只是 build 的嚴格子集：
      # 打包期才會炸的錯（動態 import 路徑寫錯、public 資產缺檔、Vite/Tailwind
      # 外掛設定壞掉）在 CI 完全看不到，只會在部署前手動 build 時才發現。
      # 這一步同時產出 backend job 需要的真 dist（見下）。
      - name: vite build
        run: npm run build

      # 傳給 backend job：SPA 服務行為（deep-link 回 index.html、資產的
      # immutable 快取標頭）只有對著**真的 build 產物**才驗得到。
      # tests/test_pre_split_guards.py 用合成 dist 骨架守「mount 順序」那條，
      # 這裡守的是另一半：真產物的 serving 與快取契約。
      - name: 上傳 dist 給後端 job
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

      - name: vitest
        run: npm test

  backend:
    name: 後端測試（pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 代價是序列化（前端約 3 分鐘，總時長從 max() 變成 sum()），換到的是
    # SPA 測試能對真 dist 跑。副作用要知道：前端 job 紅掉時本 job 直接 skipped、
    # 拿不到後端訊號——所以前端那邊把便宜的步驟（typecheck/lint）排在最前面。
    needs: frontend
    env:
      # 測試不需要 DB，也不該碰網路下載 BGE-M3（embed 是延遲載入，測試皆
      # 以假物件替代）。強制離線可讓「某天有人不小心讓測試真的去載模型」
      # 立刻失敗，而不是變成一個每次多跑好幾分鐘的沉默成本。
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # 本 job 下面那一步保證會裝好 CJK 字型，所以這裡承諾「字型一定在」：
      # tests/test_rendered_pdf_content.py 的中文那幾組**不准退回 skip**。
      # 語意與 schema job 的 REPORT_MARK_REQUIRE_DB 相同（同樣用 truthiness 判定）。
      # 存在理由是 skip 的靜默性：字型步驟即使 exit 0 也可能沒真的裝到（快取被截斷、
      # 上游改套件名），那時中文那幾組會整批變 skipped、CI 全綠而覆蓋率無聲蒸發。
      # 這條與字型步驟末尾的 fc-list 斷言是**兩道獨立的門**：fc-list 驗「系統認得字型」，
      # 這條驗「Typst 真的用得到、而且抽得回中文」——前者過而後者不過是可能的
      # （例如 Typst 找到的字型不含中文字符對應）。
      REPORT_MARK_REQUIRE_CJK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 安裝 Python 與相依套件
        run: uv sync --frozen

      # 研報 PDF 兩軌（Typst / WeasyPrint）都需要 CJK 字型，生產機也是這個前提
      # （見 README 部署章節）。runner 預設沒有：PDF 照樣編得出來、頁數也正常，
      # 但中文字位沒有 ToUnicode 對應，抽字全變 \x00 —— 於是「渲染後 PDF 真的含
      # 免責」這類內容守門在 CI 上會變成假失敗（或被跳過而失去意義）。
      #
      # 2026-08-05 事故：PR #192 只改三個前端 CSS/TSX 檔、**零個後端檔**，卻在這一步紅掉。
      # 鏡像把 61.2MB 的 fonts-noto-cjk 拖了 24.7 分鐘仍未完成，撞上本 job 的
      # timeout-minutes: 25，訊息只有 `The operation was canceled.` —— 一條測試都還沒
      # 開始跑，看起來卻像測試壞了（同一套測試另外五次都在 3.5 分鐘內完成）。
      # 三個手段各治一種失敗，缺一不可：
      #   actions/cache          → 治「鏡像不可用或很慢」：命中就完全不碰鏡像。
      #                            這是唯一真正移除失敗模式的，其餘兩個只是止血。
      #   apt 的 Retries/Timeout → 只治「連上了但不吐位元組」的卡死。
      #   step 的 timeout-minutes→ 只治「一直在吐、只是很慢」。本次事故正是這一種
      #                            （61.2MB / 24.7 分鐘 ≈ 40KB/s），apt 的任何逾時設定
      #                            對它完全無效 —— 理由見下面 Acquire::http::Timeout 那條。
      - name: 還原 CJK 字型 .deb 快取
        uses: actions/cache@v4
        # 快取服務本身也是網路呼叫（要拉 61MB），沒有上界的話它也能吃掉整個 job 的 25 分鐘
        # —— 與這次事故同型。服務不可用時 actions/cache 是 warning 不是失敗，會自然退回下載路徑。
        timeout-minutes: 5
        with:
          path: ~/deb-cache
          # key 刻意是固定字串（只有結尾的 v1 由人手動加）。拿套件版本當 key 就得先
          # apt-get update 去問鏡像 —— 那正是要避開的網路呼叫，等於白做。
          # 代價是快取凍結在當初抓到的那一版：可接受。這顆字型只用來讓測試 PDF 的中文
          # 抽得回來、不進生產（生產機自己裝），版本凍結與 gitleaks 釘死版本是同一種
          # 好處 —— 某天 CI 紅掉不會是因為上游換了東西。GitHub 快取 7 天無存取即淘汰，
          # 久沒動的 repo 會自己抓回新版，不需要人管。
          key: noto-cjk-deb-${{ runner.os }}-${{ runner.arch }}-v1

      - name: 安裝 CJK 字型（研報 PDF 內容測試需要）
        # 正常耗時：快取命中約 5 秒；未命中（apt-get update ＋ 61MB 下載 ＋ dpkg 解壓）約 30 秒。
        # 取 6 分鐘 ≈ 12 倍餘裕，且**必須嚴格小於 job 的 timeout-minutes**，否則先撞到的
        # 是 job 逾時、訊息又退回那句沒有歸屬的 operation was canceled。
        # 內層還有一個 timeout 240（只包下載），刻意再小一階，好讓腳本自己拿回控制權印出
        # 歸因訊息；剩下的約 120 秒留給 update、dpkg 與 fc-cache。三個數字的關係是
        # 「內層下載 + 安裝尾巴 < step < job」，調任何一個都要一起看。
        timeout-minutes: 6
        run: |
          set -euo pipefail
          DEB_DIR="$HOME/deb-cache"
          PKG=fonts-noto-cjk
          mkdir -p "$DEB_DIR"

          # 失敗一律走這裡：::error 會變成 run 摘要頁最上方的 annotation，不必展開 log
          # 就知道是字型掛了，而不是「後端測試紅了」。
          fail() { echo "::error title=CJK 字型安裝失敗::$1"; exit 1; }

          if ! compgen -G "$DEB_DIR/${PKG}_*.deb" > /dev/null; then
            echo "快取未命中，向 apt 鏡像下載 ${PKG}"
            # Acquire::http::Timeout 是**停滯**逾時（連線階段與其後每次 socket 讀寫各自
            # 套用），**不是整包下載的總預算**，上游預設 120 秒。所以對方持續涓滴吐位元組
            # 時它一輩子不會觸發 —— 本次事故就是這一種，只有 step 逾時擋得住。
            # Acquire::Retries 上游預設 0：一次 5xx 或連線重置就直接放棄。
            # 刻意不對 apt-get update 加內層 timeout：索引本來就有數十 MB，在慢鏡像上
            # 收得太緊會把「慢但會完成」的日子從綠改成紅，那是新製造的失敗而不是修法。
            APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get update -qq "${APT_OPTS[@]}" || fail "apt-get update 失敗（鏡像不可用？）"
            # apt-get download **不需要 root**：以現有身分把 .deb 放進當前目錄，不必碰
            # root 所有的 /var/cache/apt/archives。檔名含 URL 編碼的 epoch
            # （fonts-noto-cjk_1%3a20230817+repack1-3_all.deb），所以下面一律用 glob 比對。
            ( cd "$DEB_DIR" && timeout 240 apt-get download "$PKG" "${APT_OPTS[@]}" ) \
              || fail "${PKG} .deb 下載逾時或失敗（61MB，正常 <20 秒）"
          fi

          # dpkg -i 而非 apt-get install ./x.deb：後者會再連一次鏡像解相依，快取就白做。
          # 這顆套件可以單獨裝，依據是兩條可自行重跑的指令（不要改成引用某次 CI log）：
          #   apt-cache depends fonts-noto-cjk        → 只有「建議: fonts-noto-cjk-extra」，零 Depends
          #   apt-get download --print-uris fonts-noto-cjk → 單一 URI，61,229,778 bytes
          # 但那是對**今天這顆 runner 映像**的觀察、不是契約，所以留一條會吵的退路。
          sudo dpkg -i "$DEB_DIR/${PKG}"_*.deb || {
            echo "::warning title=字型相依未滿足::dpkg 失敗，退回 apt 修相依（runner 映像可能變了）"
            sudo apt-get -y -f install || fail "dpkg 與 apt-get -f install 都失敗"
          }
          sudo fc-cache -f > /dev/null

          # ── 後置條件斷言（不是重複檢查）──
          # 上面每一步都可能 exit 0 卻沒真的裝到字型：快取命中但 .deb 被截斷、上游改套件名、
          # 裝進 fontconfig 不看的路徑。而「安靜地沒有字型」比整步失敗更糟 ——
          # tests/test_rendered_pdf_content.py 的 _cjk_extractable() 會把中文那幾組改成
          # skip，CI 全綠、覆蓋率無聲蒸發（2026-08-05 實測 CI 是 4 skipped，那 4 條是需要
          # DB 的那兩支，中文那組當時確實有跑）。所以裝完一定要當場證明字型在。
          # sans 與 serif 兩個都驗：研報標題吃 Noto Serif CJK，缺了是靜默退回 sans。
          command -v fc-list > /dev/null \
            || fail "映像上沒有 fontconfig，無法驗證字型（WeasyPrint 那軌也會不能用）"
          for fam in "noto sans cjk" "noto serif cjk"; do
            fc-list :lang=zh family | grep -qi "$fam" \
              || fail "fc-list 找不到 ${fam}；PDF 中文內容測試會靜默退化成 skip"
          done

      # 沒有這一步，tests/test_spa_serving.py 依賴 dist 的那題會 skip 而非跑。
      - name: 取回前端 dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # 在 pytest 之前：lint 秒級完成，先擋掉死 import／未使用變數這類
      # 「一眼可見但沒人看」的缺陷，不要讓它們等 15 分鐘的測試跑完才被發現。
      - name: ruff
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q

  schema:
    name: schema 契約（PostgreSQL）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 刻意是**獨立 job**、不把 service container 加進 backend job：那會讓 1600+ 支
    # 既有測試從「連不上 DB」變成「連得上一個空 DB」。兩者對測試而言不等價——
    # 前者一定 skip 或明確失敗，後者可能安靜地跑出「查無資料」的假綠。
    services:
      db:
        # **必須與 Makefile 的 `make db` 同一顆映像**：schema 的 content_norm 生成欄
        # 與 CHECK 定義的字面輸出都受 initdb locale／版本影響，換映像＝換基準。
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REPORT_MARK_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/research
      # 讓「DB 不可用就 skip」的退路失效：service container 壞掉時要紅，
      # 不是安靜地退回零覆蓋（那正是這個 job 存在前的狀態）。
      REPORT_MARK_REQUIRE_DB: "1"
      PGPASSWORD: postgres
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 安裝 Python 與相依套件
        run: uv sync --frozen

      # runner 映像目前自帶 psql，但那不是契約（映像內容會變）。明確裝一次，
      # 否則哪天不見了會表現為「schema job 突然找不到指令」而不是可讀的訊息。
      - name: 安裝 psql（套 schema 用）
        run: |
          command -v psql >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          }

      # 跑兩次驗冪等：db/schema.sql 沒有 migration 工具，它自稱冪等是被依賴的
      # 前提（`make schema` 在既有庫上會被重複執行）。第二次要一樣安靜地成功。
      - name: 套用 db/schema.sql（兩次，驗冪等）
        run: |
          psql -h localhost -U postgres -d research -v ON_ERROR_STOP=1 -f db/schema.sql
          psql -h localhost -U postgres -d research -v ON_ERROR_STOP=1 -f db/schema.sql

      # 這兩支測試在本機一律走 skip 路徑（沒有 CI 的 DB 就驗不到），所以它們
      # 存在但等於沒跑。這個 job 就是為了讓它們真的跑起來。
      - name: content_norm 與 norm_for_match 等價性
        run: uv run pytest -q tests/test_content_norm_equivalence.py

      - name: CHECK 約束清單對帳
        run: uv run pytest -q tests/test_schema_constraints.py

  secrets:
    name: secret 掃描（gitleaks）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 刻意**不**宣告 needs：它 20 秒跑完、跟前後端都無關，沒有理由排在 3 分鐘的
    # 前端 job 後面。與 schema job 同樣獨立。
    steps:
      # fetch-depth: 0 是必要的——掃全歷史才抓得到「同一個 PR 裡先 commit 再移除」
      # 的 secret。淺 clone 只看得到最終樹，那種 secret 仍然留在 git 物件裡。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 直接裝二進位而不用 gitleaks/gitleaks-action：那個 action 對 **organization**
      # repo 要求 GITLEAKS_LICENSE，而本 repo 在 FPI-TW 組織下 ⇒ 用它會直接失敗。
      # 版本釘死：規則集會隨版本變動，浮動版本等於「某天 CI 突然紅了而 diff 是空的」。
      - name: 安裝 gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # `--redact` 讓命中內容不進 log：CI log 對整個組織可見，把 secret 印出來等於
      # 又洩漏一次（而且是在一個保存 90 天的地方）。
      - name: 掃描全歷史
        run: gitleaks git . -c .gitleaks.toml --no-banner --redact --verbose

      # 工作樹也掃一次：未追蹤／已 stage 但未 commit 的檔案不在 git 物件裡，
      # 上一步看不到。兩步的成本合計 ~20 秒。
      - name: 掃描工作樹
        run: gitleaks dir . -c .gitleaks.toml --no-banner --redact --verbose
