# Alembic 設定。連線字串刻意不寫在這裡：db/migrations/env.py 讀 REPORT_MARK_DB_URL
# （與 web 同一個鍵、同一份 repo 根 .env），免得兩處各寫一個預設庫然後連錯。
# 守門與 baseline 規則在 app/services/schema_migrations.py；操作流程見 AGENTS.md。
[alembic]
script_location = %(here)s/db/migrations
prepend_sys_path = %(here)s
# revision id 一律手給四位數（alembic revision --rev-id 0002 -m "..."），檔名才排得出順序。
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
