# deploy/EXPORT.toml —— 交付給其他券商的框架原始碼：哪些檔案進交付物、交付版怎麼改寫、交付物怎麼驗證（機器可讀）。
#
# 打包工具是 scripts/export_framework.py（make export），流程與產出見 docs/FRAMEWORK_EXPORT.md。
# 交付物＝框架；不進交付物的是廷豐專屬的東西：profiles/tingfong/、廷豐主機層（deploy/OWNERSHIP.toml 的
# tingfong_host）、只服務廷豐主機的文件與評測資產，以及只驗那些東西的測試。
#
# 規則（tests/test_export_manifest.py 守，打包工具也在打包前再核一次）：
# - deploy/、scripts/、ops_agent/ 不在這裡列：沿用 deploy/OWNERSHIP.toml（framework 進、tingfong_host 不進）。
# - 其餘每個受版控的檔案恰好被一條規則涵蓋：[paths] 的目錄規則（以 / 結尾、不巢狀）或逐檔列出（不用萬用字元，
#   也不重複列已被目錄規則涵蓋的檔）。新增檔案沒有歸類就紅，歸類是一個要寫下來的決定；列了但不存在的也紅。
# - repo 根的授權聲明（LICENSE、LICENSE.md、LICENSE.txt）一律進交付物，不必列。
# - 進交付物的檔案不得出現 [verify].forbidden 的字樣；真的非寫不可的列進 [verify.allow]，逐檔釘行數與理由。
#   紅了是改檔案（改寫成框架用語、加 export-omit 標記或排除），不是放寬白名單。

[paths]
# 整個目錄都是框架（tests/test_framework_branding.py 掃 app/、web/、frontend/src/ 的機構名）或都不是。
include_dirs = [
  "app/",
  "web/",
  "frontend/",
  "db/",
  "profiles/demo/",
]
exclude_dirs = [
  # 廷豐的 profile
  "profiles/tingfong/",
  # 廷豐語料量出的評測基準線（結果檔帶研報內容與檔名）
  "eval/baselines/",
]

