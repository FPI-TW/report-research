# deploy/OWNERSHIP.toml —— deploy/、scripts/、ops_agent/ 每個受版控檔案的歸屬（機器可讀）。
#
# 本 repo 是「券商研報平台」框架，廷豐是其中一個 profile（profiles/tingfong/）與一組主機層附加元件。兩類：
#
#   framework      框架本身：任何 profile、任何部署形態（容器、自己的主機）都用得到。框架擁有的檔案不得出現
#                  「廷豐」／tingfong（tests/test_framework_branding.py 掃描；例外逐條寫在那支測試的白名單）。
#   tingfong_host  廷豐 profile 的主機層：廷豐兩台主機（辦公室主機＝測試環境、EC2＝正式環境）的 systemd unit、
#                  sudoers、polkit、維運代理、主機信標、探針與事件、NAS 掛載、LINE bot 監看、sync 殼（NAS／R2
#                  來源段）、對外邊緣（nginx、cloudflared）、AWS 基礎設施。框架的容器部署不用它們。
#
# 規則（tests/test_ownership.py 守）：
# - 逐檔列出、不用萬用字元：新增檔案沒有歸類就紅，歸類是一個要寫下來的決定。
# - 每個檔案只能出現在一類；列了但已不存在的檔案也紅（刪檔、改名時同步改這裡）。
# - 歸類不代表可以搬：主機層的檔案大多被主機以 repo 內的路徑引用（unit 的 ExecStart、deploy/install_units.sh、
#   維運代理的安裝路徑、/etc/default 的範例、nginx include、腳本互相 source 的路徑），辦公室主機的主 checkout
#   就是部署目錄，搬了就是改部署。
# - 框架的腳本可以被主機層的 unit 呼叫（例如 db_backup.sh），反過來框架不得依賴主機層的檔案
#   （容器排程 deploy/container/scheduler.py 的 JOBS 只呼叫 framework 的腳本，同一支測試對帳）。
[framework]
files = [
  # 本清單
  "deploy/OWNERSHIP.toml",
  # 容器部署（映像、compose、排程與入口）與示範環境
