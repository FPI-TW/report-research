# EC2（正式環境）專屬的 drop-in：裝到 /etc/systemd/system/report-mark-sync.timer.d/offset.conf 後 daemon-reload。
# EC2 以 SYNC_SOURCE=r2-inbox 從 R2 inbox 拉新研報，而辦公室主機要在整點觸發、從 NAS rsync 完（約 1 分鐘）
# 才推到 inbox。兩邊都整點觸發時 EC2 永遠先拉完、晚一輪（最多約 3 小時），所以錯開 20 分鐘。
# 刻意不放 deploy/systemd/：那裡的 unit 是辦公室主機的字面值，辦公室主機不該跟著錯開。
# Persistent 維持 unit 本身的 false（理由見 tests/test_sync_timer_persistence.py），這裡只換 OnCalendar。
[Timer]
OnCalendar=
OnCalendar=*-*-* 00/3:20:00
