# clamd 設定（掛載到容器的 /etc/clamav/clamd.conf，見 ../docker-compose.yml）。
#
# 這份**整個取代**映像內建的 clamd.conf（不是疊加），所以映像原本靠 sed 改好的項目也要在這裡寫出來。
# 「必改項」那一段的每一條都對應一個「預設值會讓你以為掃過了」的陷阱，改之前先讀註解。
# 修改後：make down-clamav && make up-clamav（clamd 只在啟動時讀設定），再 make clamav-smoke。

# ── 映像的 entrypoint 依賴的項目（拿掉會起不來）──────────────────────────────

# entrypoint 啟動 clamd 後輪詢 /run/clamav/clamd.sock 或 /tmp/clamd.sock 出現才算啟動成功；
# 兩個都沒有就等滿 CLAMD_STARTUP_TIMEOUT（預設 1800 秒）後整個容器退出。
LocalSocket /tmp/clamd.sock
# 容器內聽所有介面（不寫 TCPAddr＝INADDR_ANY），否則 docker 的埠轉發進不來。
# 對主機只發佈到 127.0.0.1:3310（compose 的 ports），這才是真正的存取邊界。
TCPSocket 3310
User clamav
DatabaseDirectory /var/lib/clamav
# 不設 LogFile：entrypoint 以 --foreground 啟動 clamd，訊息同時印到 stdout → docker logs
# （ops catalog 的 logs 動作讀的就是它）。寫檔的話容器內的檔案沒人輪替。
LogTime yes
# 掃到乾淨的檔案不記（每份上傳都記一行沒有資訊量）；FOUND 與 ERROR 照記。
LogClean no

# ── 必改項：預設值會靜默放行 ──────────────────────────────────────────────

# 串流上限。預設 100M，但這裡要的是「明確、可對帳」：上傳上限 25 MB（設計決策 2），這裡要 ≥ 上限，
# 取 30M 留餘裕。超過時 INSTREAM 回 `INSTREAM size limit exceeded. ERROR` 並斷線——客戶端
# （app/services/clamd.py）把它判成決定性的未通過，絕不當 OK；客戶端自己的上限 CLAMD_STREAM_MAX_BYTES
# 預設與這個值相同，tests/test_clamav_deploy.py 對帳兩邊。
StreamMaxLength 30M

# 預設 no：檔案超過 MaxFileSize／MaxScanSize 或巢狀超過 MaxRecursion 時，clamd 只掃前面一部分、
# 剩下的直接略過，然後回 `stream: OK`——等於沒掃完就放行。開了之後改回
# `Heuristics.Limits.Exceeded.* FOUND`，客戶端視為攔截。
AlertExceedsMax yes

# 預設 no：加密的 PDF 與壓縮檔 clamd 打不開內容，預設就當乾淨。設計決策 10 拒收加密 PDF，
# 開了之後回 `Heuristics.Encrypted.PDF FOUND`（或 .Zip 等），在掃描這一層就先擋下。
AlertEncrypted yes

# 預設 yes：重載病毒碼時先把新的一整份載進記憶體、再換掉舊的，期間記憶體約翻倍（~3 GB），
# 會撞上 compose 的 mem_limit 2g 而被 OOM。關掉＝重載期間約 30–60 秒新的掃描要等（連線被接受但晾著），
# 客戶端的逾時（CLAMD_TIMEOUT，預設 120 秒）蓋得過；萬一逾時也只是暫時性錯誤、檔案留在隔離區。
ConcurrentDatabaseReload no

# ── 其餘沿用預設，寫出來是為了讓「我們依賴這個值」看得見 ────────────────────

# 單一檔案與單次掃描的資料量上限（預設 100M／400M）都遠大於 30M 的串流上限；
# 超過時由上面的 AlertExceedsMax 轉成 FOUND。
MaxFileSize 100M
MaxScanSize 400M
# 每 10 分鐘檢查病毒碼目錄有沒有變（freshclam 另外會以 NotifyClamd 主動通知）。
SelfCheck 600
