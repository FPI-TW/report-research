# freshclam 設定（掛載到容器的 /etc/clamav/freshclam.conf，見 ../docker-compose.yml）。
#
# 因為 compose 掛載的是整個 /etc/clamav 目錄（理由見 compose 檔），映像內建的 freshclam.conf 會被蓋掉，
# 所以這份要自己寫齊。內容等同映像建置時對官方範本做的修改（DatabaseOwner、NotifyClamd、ScriptedUpdates），
# 只是不寫 UpdateLogFile：讓訊息走 stdout → docker logs。
# 每天檢查幾次不在這裡：映像的 entrypoint 以 --checks="$FRESHCLAM_CHECKS" 啟動 freshclam（會蓋過 Checks），
# 值設在 compose 的 environment。

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
LogTime yes
# 更新完通知 clamd 重載（clamd 的 SelfCheck 也會在 10 分鐘內自己發現）。
NotifyClamd /etc/clamav/clamd.conf
# 預設 yes：新病毒碼先在 freshclam 行程裡試載一次、能用才換上。代價是試載期間 freshclam 也佔記憶體
# （與 clamd 同一個 mem_limit）。上線後一週觀察 `docker inspect report-mark-clamav` 的 OOMKilled 與
# health；若因此被 OOM，再評估改成 no（見 docs/CAPACITY.md「常駐元件：ClamAV」）。
TestDatabases yes
