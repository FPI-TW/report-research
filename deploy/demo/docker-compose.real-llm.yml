# 示範環境改接真的 LLM：疊在 docker-compose.yml＋../demo/docker-compose.demo.yml 之後（順序要在 demo 之後）。
#
#   docker compose -f docker-compose.yml -f ../demo/docker-compose.demo.yml -f ../demo/docker-compose.real-llm.yml up -d
#
# demo override 把 LLM 指到假 LLM、並把每個任務旋鈕設成假 LLM 的模型名；這一份把那些鍵**改回 .env 裡的值**
# （沒寫就是空＝照 app/services/llm_models.py 的解析規則走 LLM_DEFAULT_MODEL 或預設表）。所以真的 LLM 設定一律
# 寫在 .env（與一般部署相同：LLM_PROVIDER＋該 provider 的金鑰、端點與模型宣告，見 repo 根 .env.example）。
# 假 LLM 服務照樣起著但沒有人連它；S3 測試伺服器不受影響。

x-real-llm-env: &real-llm-env
  LLM_PROVIDER: ${LLM_PROVIDER:?LLM_PROVIDER 必填（真的 LLM 的送達路徑，見 repo 根 .env.example）}
  OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
  OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
  OPENAI_COMPATIBLE_MODELS: ${OPENAI_COMPATIBLE_MODELS:-}
  ASK_ANSWER_MODEL: ${ASK_ANSWER_MODEL:-}
  ASK_INTENT_MODEL: ${ASK_INTENT_MODEL:-}
  ASK_CONDENSE_MODEL: ${ASK_CONDENSE_MODEL:-}
  QA_PLANNER_MODEL: ${QA_PLANNER_MODEL:-}
  ASK_FOLLOWUP_MODEL: ${ASK_FOLLOWUP_MODEL:-}
  FAITHFULNESS_MODEL: ${FAITHFULNESS_MODEL:-}
  EVAL_JUDGE_MODEL: ${EVAL_JUDGE_MODEL:-}
  TAG_MODEL: ${TAG_MODEL:-}
  SUMMARY_MODEL: ${SUMMARY_MODEL:-}
  TITLE_MODEL: ${TITLE_MODEL:-}
  TAKEAWAY_MODEL: ${TAKEAWAY_MODEL:-}
  SIGNAL_MODEL: ${SIGNAL_MODEL:-}
  BRIEF_MODEL: ${BRIEF_MODEL:-}

services:
  web:
    environment: *real-llm-env
  worker:
    environment: *real-llm-env
  scheduler:
    environment: *real-llm-env
  migrate:
    environment: *real-llm-env
