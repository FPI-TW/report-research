# 廷豐研報 對外存取邊緣：nginx 反向代理 + cloudflared 隧道
# 用法：先 `make edge-passwd` 設定 Basic Auth，填好 deploy/.env 的 TUNNEL_TOKEN，再 `make up-edge`
services:
  nginx:
    image: nginx:1.31-alpine  # 釘穩定 minor，可重現；bump 時改這裡
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets:/etc/nginx/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge
    # 不對 host 發佈任何埠；僅 compose 網路內供 cloudflared 取用

  cloudflared:
    image: cloudflare/cloudflared:latest  # 刻意留 latest：確保與 Cloudflare 邊緣相容（太舊的連接器會被拒連）
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - edge
    depends_on:
      - nginx

networks:
  # 固定 subnet，讓 nginx 能精確只信任 cloudflared 送來的 CF-Connecting-IP（見 nginx.conf set_real_ip_from）
  edge:
    ipam:
      config:
        - subnet: 10.89.0.0/24
