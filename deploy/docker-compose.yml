# 廷豐研報 對外存取邊緣：nginx 反向代理 + cloudflared 隧道
# 用法：填好 deploy/.env 的 TUNNEL_TOKEN，再 `make up-edge`（登入改由 App 處理，邊緣不再設 Basic Auth）
services:
  nginx:
    image: nginx:1.31-alpine  # 釘穩定 minor，可重現；bump 時改這裡
    restart: unless-stopped
    volumes:
      # 掛成 template 而非直接掛 conf.d：祕密值（X-Edge-Secret）不能寫進 repo，
      # 官方映像的 entrypoint 會在啟動時以 envsubst 渲染成 conf.d/default.conf。
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      # 與 repo 根 .env 的 REPORT_MARK_EDGE_SECRET 必須是同一個值（一邊改、另一邊
      # 沒改的期間，App 會自動退回 CIDR 判定，不會把人擋在外面）。未設＝空字串＝
      # App 端停用該路徑。
      - EDGE_SECRET=${EDGE_SECRET:-}
      # 只代換 EDGE_ 開頭的變數：否則 nginx.conf 裡的 $host / $remote_addr 等內建
      # 變數有被同名環境變數吃掉的風險（envsubst 不認得 nginx 語法）。
      - NGINX_ENVSUBST_FILTER=^EDGE_
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge
    # 不對 host 發佈任何埠；僅 compose 網路內供 cloudflared 取用

  cloudflared:
    image: cloudflare/cloudflared:latest  # 刻意留 latest：確保與 Cloudflare 邊緣相容（太舊的連接器會被拒連）
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - edge
    depends_on:
      - nginx

networks:
  # 固定 subnet，讓 nginx 能精確只信任 cloudflared 送來的 CF-Connecting-IP（見 nginx.conf set_real_ip_from）
  edge:
    ipam:
      config:
        - subnet: 10.89.0.0/24
