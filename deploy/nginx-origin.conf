# 廷豐研報 EC2 staging 的來源站反向代理（Cloudflare 橘雲 → EIP:443 → 本機 nginx → uvicorn :8097）
#
# 與 deploy/nginx.conf（辦公室主機、經 Cloudflare Tunnel、跑在 docker）是兩條不同的入口：
# 這份給 EC2 上以 apt 安裝的 nginx 直接用，安裝到 /etc/nginx/sites-available/report-mark。
#
# 安全前提（缺一不可）：
#   - Security Group 只放行 Cloudflare IPv4 範圍的 TCP/443（deploy/aws/infrastructure.yaml 的
#     CloudflareOriginPrefixList）；80、8097 不對外。
#   - research.tingfong.com 維持橘雲：來源站憑證是 Cloudflare Origin CA，只有 Cloudflare 信任它，
#     關掉代理瀏覽器就會報憑證錯誤。Cloudflare 的 SSL/TLS 模式要是 Full (strict)。
#   - App 信任本代理靠的是對端 127.0.0.1（REPORT_MARK_TRUSTED_PROXY_CIDRS 預設含 127.0.0.1/32），
#     所以 proxy_pass 一定要走 127.0.0.1，不能改成 EIP 或私有 IP。
#
# 憑證：/etc/ssl/report-mark/origin.pem（0644）與 origin.key（0600 root），不進 repo。

# 限流 key 與靜態資產豁免沿用 deploy/nginx.conf（2026-07-31 事故：冷載 37 個 js/css 被限流回 503）。
map $uri $rl_key {
    default        $binary_remote_addr;
    ~^/app/assets/ "";
}
limit_req_zone $rl_key zone=edge:10m rate=10r/s;

# 不是 research.tingfong.com 的 TLS 連線（直接打 IP、掃描器、別人把網域指過來）一律拒絕握手。
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    # Ubuntu 24.04 的 nginx 是 1.24：`http2 on;` 要 1.25.1 起才有，只能寫在 listen 上。
    listen 443 ssl http2;
    server_name research.tingfong.com;

    ssl_certificate     /etc/ssl/report-mark/origin.pem;
    ssl_certificate_key /etc/ssl/report-mark/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 還原真實訪客 IP：只信任 Cloudflare 的 IPv4 範圍（與 CloudflareOriginPrefixList 逐字相同，
    # 來源 https://www.cloudflare.com/ips-v4，2026-10-02）。漏改這裡的後果是限流與登入失敗追蹤
    # 全部算在 Cloudflare 節點頭上。
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # 唯讀檢索，無上傳；限制 body 大小
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        limit_req zone=edge burst=20 nodelay;

        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆寫而非附加：客戶端自帶的 X-Forwarded-For 不可透傳給 App。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # 一律清空：本入口不用邊緣共享祕密（信任靠 127.0.0.1），也不讓客戶端自帶的同名 header 透傳。
        proxy_set_header X-Edge-Secret "";
        proxy_set_header Authorization "";

        # BGE-M3 查詢嵌入可能稍慢；問答 SSE 靠 App 的 20s 心跳維持連線（web/deps.py _with_heartbeat）。
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
