# 廷豐研報 對外反向代理（經 Cloudflare Tunnel 進入）
# 路徑：cloudflared → nginx(:80) → host uvicorn :8097（登入改由 App 處理，邊緣不再設 Basic Auth）
# 安全前提：nginx 不對 host 發佈任何埠，唯一入口是 cloudflared 隧道。
#          只信任 edge 專屬網段（compose 固定 subnet）送來的 CF-Connecting-IP，
#          避免日後有其他容器進此 network 時偽造來源 IP，污染限流與日誌。
#
# 本檔是 **envsubst 模板**：docker-compose 把它掛到 /etc/nginx/templates/default.conf.template，
# 官方映像的 entrypoint 在啟動時渲染成 /etc/nginx/conf.d/default.conf。
# 只有 ${EDGE_*} 會被代換（NGINX_ENVSUBST_FILTER=^EDGE_），$host / $remote_addr
# 這類 nginx 內建變數維持原樣。祕密值不進 repo，改設定後需 `make edge-reload`
# （模板只在容器啟動時渲染一次，`nginx -s reload` 不會重新代換）。

# 限流區：以（還原後的）真實來源 IP 為 key
limit_req_zone $binary_remote_addr zone=edge:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # 還原 Cloudflare 帶來的真實訪客 IP：只信任 cloudflared 所在的固定 subnet
    # （見 docker-compose.yml 的 networks.edge.ipam）
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 10.89.0.0/24;

    # 唯讀檢索，無上傳；限制 body 大小
    client_max_body_size 1m;

    # 安全標頭（even on 401 也帶上）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        limit_req zone=edge burst=20 nodelay;

        proxy_pass http://host.docker.internal:8097;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 邊緣共享祕密：App 據此認定「這是從本代理進來的」，取代（並與之並存）
        # 那個會隨 WSL 重開機漂移的閘道 IP 判定（REPORT_MARK_TRUSTED_PROXY_CIDRS）。
        # **一律覆寫**，即使 EDGE_SECRET 為空——否則客戶端自帶的同名 header 會被透傳。
        proxy_set_header X-Edge-Secret "${EDGE_SECRET}";
        # 防禦性清空 Authorization：後端以 session cookie 認證，不使用此標頭，避免任何外來 Authorization 透傳
        proxy_set_header Authorization "";

        # BGE-M3 查詢嵌入可能稍慢，放寬讀取逾時
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
