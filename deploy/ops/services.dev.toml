# report-mark 維運代理的 Service Catalog（開發環境）。格式與驗證規則見 ops_agent/catalog.py。
#
# development catalog 只能列 report-mark-dev-* 的 unit 與 report-mark-dev* 的容器（代理載入時檢查），
# socket 也和生產不同（/run/report-mark-ops-dev/agent.sock）：dev 代理結構上碰不到生產服務。
# 本機冒煙可用 --socket 指到臨時路徑（只有 development 允許覆寫）。

schema = 1
environment = "development"
socket_path = "/run/report-mark-ops-dev/agent.sock"

[agent]
# 開發用 web（worktree 的 uvicorn）的執行身分。
allowed_users = ["kashionz"]
request_timeout = 15
command_timeout = 8
max_response_bytes = 262144
max_log_lines = 1000
max_log_age_hours = 168
max_concurrent = 4
systemctl = "/usr/bin/systemctl"
journalctl = "/usr/bin/journalctl"
docker = "/usr/bin/docker"

[[services]]
name = "devdb"
kind = "container"
container = "report-mark-devdb"
tier = "critical"
actions = ["status", "logs"]
description = "開發驗證庫（生產複本，127.0.0.1:5437）"

# 開發用 web 目前是手動起的 uvicorn，還沒有 unit；裝了 report-mark-dev-web.service 之前這列回 not_found。
[[services]]
name = "dev-web"
kind = "systemd"
unit = "report-mark-dev-web.service"
tier = "important"
actions = ["status", "logs"]
description = "開發用 web（尚未建立 unit）"
