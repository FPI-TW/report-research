# ── 帳號刪除（L1）────────────────────────────────────────────────────────────
# 唯讀：刪除排程到期才由 timer 執行；不給 run——手動「立即執行」會繞過 24 小時撤銷窗口的語意
# （execute_deletions 只處理到期的排程，但讓人誤以為能提前刪）。重放由還原流程手動跑。

[[services]]
name = "delete-accounts"
kind = "systemd"
unit = "report-mark-delete-accounts.service"
timer = "report-mark-delete-accounts.timer"
tier = "important"
actions = ["status", "logs"]
depends_on = ["postgres", "nas"]
description = "執行到期的帳號刪除（先寫 NAS tombstone 再刪 DB，每小時）"

[[services]]
name = "replay-deletions"
kind = "systemd"
unit = "report-mark-replay-deletions.service"
timer = "report-mark-replay-deletions.timer"
tier = "important"
actions = ["status", "logs"]
depends_on = ["postgres", "nas"]
description = "還原後重放帳號刪除（比對 NAS tombstone，資料復活就重刪並告警，每日）"

# ── schema 與版本 drift（v1.5）──────────────────────────────────────────────
# 唯讀：不給 run——完整比對會在 PostgreSQL 伺服器上建、刪暫存庫，要手動跑就 make schema-check／schema-version。

[[services]]
name = "schema-check"
kind = "systemd"
unit = "report-mark-schema-check.service"
timer = "report-mark-schema-check.timer"
tier = "supporting"
actions = ["status", "logs"]
depends_on = ["postgres"]
description = "schema 與 alembic 版本 drift 每日檢查（05:20）"

# ── 檢索回歸（v1.5）─────────────────────────────────────────────────────────
# 唯讀：不給 run——每次會載入 BGE-M3（約 2 GiB）並自己檢查可用記憶體；要手動跑照 docs/production_resilience.md。

[[services]]
name = "retrieval-regression"
kind = "systemd"
unit = "report-mark-retrieval-regression.service"
timer = "report-mark-retrieval-regression.timer"
tier = "supporting"
actions = ["status", "logs"]
depends_on = ["postgres"]
description = "檢索回歸檢查（凍結題集對基準，07:40，零 LLM）"

# ── 上傳掃描（v1.5 PR-3）────────────────────────────────────────────────────
# 唯讀容器（deploy/clamav/docker-compose.yml 固定 container_name；make up-clamav）。容器探針同名同 tier
# （scripts/check_container_health.sh 的 CONTAINER_HEALTH_TARGETS 預設值，tests/test_container_host_probes.py 對帳）。
# 依賴圖：下游是上傳 worker（upload 的 depends_on）。clamd 自己不依賴任何 catalog 節點（freshclam 連外更新
# 病毒碼失敗時，由 worker 的 72 小時病毒碼年齡閘門 fail-closed）。

[[services]]
name = "clamav"
kind = "container"
container = "report-mark-clamav"
tier = "supporting"
actions = ["status", "logs"]
description = "ClamAV clamd（上傳掃描，127.0.0.1:3310；停了上傳只會留在隔離區）"

# ── 上傳 worker（v1.5 PR-5）──────────────────────────────────────────────────
# run＝立即跑一輪（設計決策 3；等同 timer 觸發，不收參數）。execution group 刻意自成一組 upload、**不併進
# llm-batch**：worker 的互斥靠自己的整輪鎖（flock_files）；入庫段與 sync／手動 LLM 批次的互斥靠 claude 鎖
# （撞到就 rc 75、乾淨檔留到下一輪，掃描與清除照做）。併進 llm-batch 的話，任何 LLM 批次持鎖的那幾小時
# 「立即執行」都會被拒（連掃毒都不能立刻跑），sync 的 run 也會在每 5 分鐘一輪的 worker 執行時被拒，換不到東西。
# 鎖檔路徑與 scripts/process_uploads.sh 的 LOCK 預設值一致（tests/test_ops_agent_actions.py 對帳）。

[[services]]
name = "upload"
kind = "systemd"
unit = "report-mark-upload.service"
timer = "report-mark-upload.timer"
tier = "supporting"
actions = ["status", "logs", "run"]
group = "upload"
flock_files = ["/home/kashionz/projects/report-mark/data/.upload_worker.lock"]
depends_on = ["postgres", "clamav", "deepseek", "r2"]
description = "上傳 worker（掃毒、草稿入庫、清除；每 5 分鐘）"

# ── Admin v2：DB 統計快照、使用分析彙總、安全告警與保留期清除 ──────────────────────
# 安裝步驟在 docs/production_resilience.md 各自的章節，順序見同檔「Admin v2 部署順序」。run 逐項判斷：
# - db-snapshot 給 run：只查系統目錄、寫 db_stat_snapshot（同一小時已有就不寫、每日列已有就不補，ON CONFLICT DO
#   NOTHING），零 LLM、無外部費用；它順手做的保留期刪除與 timer 觸發時完全相同（依當下時間刪逐時 30 天、每日 400 天
#   之外的監控統計），多跑一次不會多刪。用途：裝好後立刻驗收、或趨勢缺一段時補一筆。
# - analytics-rollup 給 run：純 SQL、零 LLM；預設模式（run 不收參數，只會是這個模式）覆寫昨天並補齊窗期內缺的日子，
#   一天一個交易先刪後寫，重跑同一天結果相同；同一天的並行以 advisory lock 排隊。不會碰 --force 的重算。
# - 兩者各自一個 group：彼此與既有批次沒有共用的鎖或資源（不碰 claude 鎖、不呼叫 LLM、不載嵌入模型），併進
#   別的 group 只會讓「立即執行」在無關批次跑的時候被拒。
# - security-health／security-incident 不給 run：探針與 P5 狀態機每 2 分鐘就跑；手動插一輪會打亂 incident_handler.sh
#   以觸發間隔校準的過期與信任窗判斷（同 health／incident 類）。
# - security-retention 不給 run：會刪資料（auth_event 超過 365 天、結束超過 90 天的 session）；排程刻意排在備份與
#   稽核錨定之後，手動提前跑會在當天備份帶走之前就刪掉。
# 探針刻意不依賴它探的對象（同上面 *-health 的規則）；security-incident 依賴 slack。

[[services]]
name = "db-snapshot"
kind = "systemd"
unit = "report-mark-db-snapshot.service"
timer = "report-mark-db-snapshot.timer"
tier = "supporting"
actions = ["status", "logs", "run"]
group = "db-snapshot"
depends_on = ["postgres"]
description = "DB 統計快照（系統目錄→db_stat_snapshot，每小時 :40，零 LLM）"

[[services]]
name = "analytics-rollup"
kind = "systemd"
unit = "report-mark-analytics-rollup.service"
timer = "report-mark-analytics-rollup.timer"
tier = "supporting"
actions = ["status", "logs", "run"]
group = "analytics-rollup"
depends_on = ["postgres"]
description = "使用分析每晚彙總（analytics_daily，02:20，零 LLM）"

[[services]]
name = "security-health"
kind = "systemd"
unit = "report-mark-security-health.service"
timer = "report-mark-security-health.timer"
tier = "important"
actions = ["status", "logs"]
description = "安全事件探針（/healthz/security，每 2 分鐘）"

[[services]]
name = "security-incident"
kind = "systemd"
unit = "report-mark-security-incident.service"
timer = "report-mark-security-incident.timer"
tier = "important"
actions = ["status", "logs"]
depends_on = ["slack"]
description = "安全事件偵測與通知（每 2 分鐘）"

[[services]]
name = "security-retention"
kind = "systemd"
unit = "report-mark-security-retention.service"
timer = "report-mark-security-retention.timer"
tier = "supporting"
actions = ["status", "logs"]
depends_on = ["postgres"]
description = "登入事件與已結束 session 的保留期清除（04:45）"

# ── 外部依賴（依賴圖的節點；代理不查也不動它們）──────────────────────────────
# 退出碼對照：scripts/check_web_health.sh（6＝R2、7＝DeepSeek 餘額低、8＝DeepSeek 不可用；優先序 8→5→6→7，
# 被蓋住的那項判斷不出來）、scripts/check_edge_health.sh（1＝邊緣故障、3＝origin 自己壞了、4＝判不出來）、
# scripts/check_linebot_health.sh（1＝bot 沒在跑、2＝存不了檔）。

[[externals]]
name = "r2"
tier = "critical"
probe = "health"
down_exit_codes = [6]
description = "Cloudflare R2 物件儲存（原檔、PDF；/healthz/storage）"

[[externals]]
name = "deepseek"
tier = "critical"
probe = "health"
degraded_exit_codes = [7]
down_exit_codes = [8]
description = "DeepSeek API（問答與批次 LLM；/healthz/llm）"

[[externals]]
name = "nas"
tier = "important"
description = "NAS（研報來源掛載、備份與帳號刪除 tombstone；未監控）"

[[externals]]
name = "slack"
tier = "important"
description = "Slack 告警 webhook（P5 事件通知；未監控）"

[[externals]]
name = "public-edge"
tier = "critical"
depends_on = ["cloudflared"]
probe = "edge-health"
down_exit_codes = [1]
description = "對外網址（Cloudflare → 隧道 → nginx；edge-health 從本機打對外 /healthz）"

[[externals]]
name = "linebot"
tier = "supporting"
depends_on = ["nas"]
probe = "linebot-health"
degraded_exit_codes = [2]
down_exit_codes = [1]
description = "LINE bot（Windows 主機，下載研報到 NAS）"
