[Service]
# /api/ask 與意圖閘門透過 claude CLI 子程序運作；claude 安裝在 nvm 的 node bin，
# 不在 systemd 預設 PATH 中。補上 nvm bin（含 claude/node/npm），否則 /api/ask
# 會以 FileNotFoundError: 'claude' 失敗（前端顯示「問答服務發生錯誤」）。
# 註：若日後用 nvm 升級 node 預設版本，需同步更新此處的版本路徑。
Environment=PATH=/home/kashionz/.nvm/versions/node/v24.15.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
