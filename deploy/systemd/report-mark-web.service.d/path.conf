[Service]
# /api/ask 與意圖閘門透過 claude CLI 子程序運作；claude 不在 systemd 預設 PATH 中，
# 少了它 /api/ask 會以 FileNotFoundError: 'claude' 失敗（前端顯示「問答服務發生錯誤」），
# 而 /healthz 只探 DB，P4／P5 監控完全看不到這種中斷。
#
# 2026-09-02 實際出事：claude 從 npm 全域（nvm 的 node bin）改裝成原生安裝
# （~/.local/bin/claude → ~/.local/share/claude/versions/<ver>），舊路徑下的 claude
# 隨之消失，問答從 08:53 起全數失敗、直到受控壓測才被發現。
#
# 所以這裡同時列兩條：原生安裝的 ~/.local/bin 在前（與 /etc/default/report-mark-sync
# 的 SYNC_PATH_EXTRA 一致），nvm 的 node bin 保留給仍需 node 的工具。
# 註：若日後用 nvm 升級 node 預設版本，需同步更新 nvm 那段的版本路徑。
Environment=PATH=/home/kashionz/.local/bin:/home/kashionz/.nvm/versions/node/v24.15.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
