# 廷豐智能研報的 profile（預設 profile：PROFILE_DIR 未設時載入這一份）。
# 格式與驗證規則見 app/profile.py 的模組 docstring：未知的 section 或鍵、型別錯、引用不存在的 asset、
# 非標準市場代碼一律拒絕啟動。祕密與部署層設定不放這裡。

[institution]
name = "廷豐"
product_name = "廷豐智能研報"
short_name = "廷豐研報"
# 對外網址：只用在送給 LLM 供應商的自報身分（OpenCode Go 的 User-Agent；tests/fixtures/llm_wire_golden.json 逐字釘住）。
website = "https://research.tingfong.com"

# 英文介面用的名稱（name_en、product_name_en、short_name_en）沒給：英文介面沿用上面的中文原名。

[branding]
logo_light = "logo.png"
logo_dark = "logo.png"
favicon = "favicon.svg"

# 強調色：廷豐的鎏金（框架預設是中性的石板藍，見 frontend/src/styles/tokens.css）。鍵見 app/profile.py 的
# ACCENT_TOKENS，對到哪些 CSS 變數見 frontend/src/lib/branding.ts 的 ACCENT_CSS_VARS（登入頁另見
# web/routers/auth_pages.py 的 LOGIN_ACCENT_VARS）。值是框架去品牌之前 tokens.css 與 login.html 的原值，
# tests/test_brand_accent.py 逐變數比對：改了廷豐畫面就會變。
[branding.colors.light]
accent_text = "#8a5a0f"
accent_strong = "#ae7415"
accent_hover = "#7a4f0c"
accent_tint = "#f8f1e0"
accent_line = "#ead9ae"
accent_panel = "#fbf7ec"
on_accent = "#ffffff"
accent_button = "#946110"
# 管理後台的線色與選取底色比研報平台淺一階（主控台改版時的定稿值）。
console_accent_line = "#e6d3a3"
console_accent_panel = "#fbf6ea"

[branding.colors.dark]
accent_text = "#e2b968"
accent_strong = "#d4a64a"
accent_hover = "#edc97f"
accent_tint = "rgba(212, 166, 74, 0.14)"
accent_line = "rgba(212, 166, 74, 0.4)"
accent_panel = "rgba(212, 166, 74, 0.07)"
on_accent = "#17130a"
accent_button = "#d4a64a"

[prompt]
# 注入問答、路由、規劃、評估各段 prompt 的稱謂。改了它，系統提示就與評測基準線不同
# （tests/test_profile_prompts.py 以改動前的全文為 golden 逐字比對）。
system_name = "廷豐研報"
system_name_en = "廷豐研報"

[markets]
# 標準市場代碼全部啟用；順序＝使用者端選單的顯示順序。
# 代碼與 findb 的 instruments.market 對齊，是廷豐的跨 repo 契約（tests/test_tagging.py 逐字釘住標準詞彙）。
enabled = ["TW", "US", "HK", "CN", "WTX", "FX", "MACRO", "GLOBAL", "CRYPTO"]

[security]
totp_issuer = "廷豐智能研報"

# 文件類型與各類型啟用的功能（功能詞彙見 app/profile.py 的 DOC_FEATURES）。
# research 全開、non_research 全關＝改動前的 is_research true／false（零回歸）。
[doc_types.research]
features = ["search", "reading", "tagging_markets", "summary", "title", "takeaway", "signal", "radar", "brief", "overview"]

[doc_types.non_research]
features = []

[connectors]
# 資料來源連接器（app/services/connectors/）。廷豐的來源由主機層的 scripts/sync_new_reports.sh 執行
# （辦公室主機：NAS 掛載 → rsync；EC2：SYNC_SOURCE=r2-inbox），sync 鏈第 4 段起不變；框架的連接器輪詢
# （scripts/connector_sync.py）因此不啟用任何連接器。下面兩個宣告是現行來源在框架詞彙裡的對應：
# 改由框架輪詢時把名稱加進 enabled，並停用該主機的 report-mark-sync.timer（兩條路徑不可同時跑）。
enabled = []

[connectors.sources.nas]
# NAS 研報資料夾經 rsync 落地的本地鏡像（掛載與 rsync 屬主機層，框架不做 mount）。
kind = "folder"
path = "研報自動匯入"
poll_minutes = 180

[connectors.sources.r2-inbox]
# 辦公室主機推到 R2 的 inbox/（scripts/r2_inbox.py push）；拉回同一個本地鏡像。
# 憑證：CONNECTOR_R2_INBOX_ENDPOINT／_BUCKET／_ACCESS_KEY_ID／_SECRET_ACCESS_KEY，值同 R2_*。
kind = "s3"
prefix = "inbox/"
landing = "研報自動匯入"
env = "CONNECTOR_R2_INBOX"
poll_minutes = 180

[backfill]
# 首次導入的分層回填（scripts/backfill_tiers.py；docs/WORKFLOW.md「首次導入」）。廷豐的語料已全量跑完派生，
# sync 鏈照舊處理新研報；背景補齊因此關閉（scheduler 的 backfill-tiers 工作是 no-op），窗期只影響手動估價與查進度。
recent_months = 12
background_enabled = false

[locale]
# 介面與問答回答的語系（介面字串在 frontend/src/i18n/）：使用者沒選過語言時用 default，available 是可選的語系。
# 預設中文＝改動前的行為；使用者在「設定 → 偏好 → 語言」或登入頁切換，偏好存在瀏覽器（tf.locale／tf_locale）。
default = "zh-Hant"
available = ["zh-Hant", "en"]

[instruments]
# 個股代號格式：標註結果的 stock_targets 只留符合其一的代號（各市場格式的聯集，不看研報的市場）。
# 廷豐只收 4 碼數字（框架化之前的規則，也是標註 prompt 要求的格式）；放寬會讓既有研報與新研報的標的口徑不一。
[instruments.code_formats.TW]
kind = "digits"
min_length = 4
max_length = 4

[sources]
# 發行機構名單（檔名 token、內文指紋、顯示名稱）；格式見該檔檔頭。
catalog = "sources.toml"

[brief]
# 每日簡報的作息：本地時間 9 時後才產生當日簡報（券商早報多在上午進來）；沒有上一份時回看 24 小時、最多回看 7 天。
after_hour = 9
default_lookback_hours = 24
max_lookback_days = 7
