# 廷豐智能研報的 profile（預設 profile：PROFILE_DIR 未設時載入這一份）。
# 格式與驗證規則見 app/profile.py 的模組 docstring：未知的 section 或鍵、型別錯、引用不存在的 asset、
# 非標準市場代碼一律拒絕啟動。祕密與部署層設定不放這裡。

[institution]
name = "廷豐"
product_name = "廷豐智能研報"
short_name = "廷豐研報"

[branding]
logo_light = "logo.png"
logo_dark = "logo.png"
favicon = "favicon.svg"
# 強調色不覆寫：frontend/src/styles/tokens.css 的預設鎏金即廷豐的色票。

[prompt]
# 注入問答、路由、規劃、評估各段 prompt 的稱謂。改了它，系統提示就與評測基準線不同
# （tests/test_profile_prompts.py 以改動前的全文為 golden 逐字比對）。
system_name = "廷豐研報"
system_name_en = "廷豐研報"

[markets]
# 標準市場代碼全部啟用；順序＝使用者端選單的顯示順序。
# 代碼與 findb 的 instruments.market 對齊，是廷豐的跨 repo 契約（tests/test_tagging.py 逐字釘住標準詞彙）。
enabled = ["TW", "US", "HK", "CN", "WTX", "FX", "MACRO", "GLOBAL", "CRYPTO"]

[security]
totp_issuer = "廷豐智能研報"

# 文件類型與各類型啟用的功能（功能詞彙見 app/profile.py 的 DOC_FEATURES）。
# research 全開、non_research 全關＝改動前的 is_research true／false（零回歸）。
[doc_types.research]
features = ["search", "reading", "tagging_markets", "summary", "title", "takeaway", "signal", "radar", "brief", "overview"]

[doc_types.non_research]
features = []

[connectors]
# 資料來源連接器（app/services/connectors/）。廷豐的來源由主機層的 scripts/sync_new_reports.sh 執行
# （辦公室主機：NAS 掛載 → rsync；EC2：SYNC_SOURCE=r2-inbox），sync 鏈第 4 段起不變；框架的連接器輪詢
# （scripts/connector_sync.py）因此不啟用任何連接器。下面兩個宣告是現行來源在框架詞彙裡的對應：
# 改由框架輪詢時把名稱加進 enabled，並停用該主機的 report-mark-sync.timer（兩條路徑不可同時跑）。
enabled = []

[connectors.sources.nas]
# NAS 研報資料夾經 rsync 落地的本地鏡像（掛載與 rsync 屬主機層，框架不做 mount）。
kind = "folder"
path = "研報自動匯入"
poll_minutes = 180

[connectors.sources.r2-inbox]
# 辦公室主機推到 R2 的 inbox/（scripts/r2_inbox.py push）；拉回同一個本地鏡像。
# 憑證：CONNECTOR_R2_INBOX_ENDPOINT／_BUCKET／_ACCESS_KEY_ID／_SECRET_ACCESS_KEY，值同 R2_*。
kind = "s3"
prefix = "inbox/"
landing = "研報自動匯入"
env = "CONNECTOR_R2_INBOX"
poll_minutes = 180

[backfill]
# 首次導入的分層回填（scripts/backfill_tiers.py；docs/WORKFLOW.md「首次導入」）。廷豐的語料已全量跑完派生，
# sync 鏈照舊處理新研報；背景補齊因此關閉（scheduler 的 backfill-tiers 工作是 no-op），窗期只影響手動估價與查進度。
recent_months = 12
background_enabled = false
