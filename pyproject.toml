[project]
name = "report-mark"
version = "0.1.0"
description = "研報市場標籤分類 + pgvector 語意檢索（原型）"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "FlagEmbedding>=1.2",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "python-multipart>=0.0.9",
    "weasyprint>=69.0",
    "markdown>=3.10.2",
    "typst>=0.15.0",
    "pypandoc-binary>=1.17",
]

[dependency-groups]
# 測試相依。先前完全沒宣告，本機 .venv 是手動裝出來的——乾淨 clone 後
# `uv sync` 跑不了測試，CI 也裝不到 pytest（加 CI 時才發現）。
# 版本對齊本機已驗證通過全套的環境。
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[tool.uv]
# CPU-only torch；避免抓 CUDA 輪子
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
