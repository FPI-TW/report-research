[project]
name = "report-mark"
version = "0.1.0"
description = "研報市場標籤分類 + pgvector 語意檢索（原型）"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "boto3>=1.35",
    "pgvector>=0.3",
    "pypdf>=4.2",
    # 版面感知抽取（app/services/extraction/）。pdfplumber 連帶帶進 pdfminer.six
    # （被它釘成 ==，無法獨立升）與 pypdfium2，兩者授權分別是 MIT 與 BSD-3/Apache-2.0。
    # **刻意不用 PyMuPDF**：它是 AGPL-3.0／商用雙授權，而本站經 Cloudflare Tunnel
    # 對外服務，AGPL §13 的網路條款會被觸發。詳見 docs/EXTRACTION.md §2。
    # 這條約束由 tests/test_license_guard.py 機械化守門（含遞移相依）。
    "pdfplumber>=0.11.10",
    "python-docx>=1.1",
    "FlagEmbedding>=1.2",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "python-multipart>=0.0.9",
    # 簡體→繁體字形正規化（app/services/zh_hant.py）。純 Python + JSON 詞典，
    # 無 C 擴充；只有批次會用到，web 不載入（轉換器延後建構）。
    "opencc-python-reimplemented>=0.1.7",
    # torch 必須是 **direct** dependency，否則 [tool.uv.sources] 對它無效。
    # 實測（2026-08-19，spike/cpu-only-pytorch）：在此之前 torch 只是
    # FlagEmbedding／sentence-transformers／accelerate／peft 的遞移相依，
    # uv.lock 裡它來自 pypi.org/simple、`download.pytorch.org` 出現 0 次，
    # 且連帶鎖進 16 個 nvidia-*／triton 套件（實測佔 3.4 GiB）。
    # uv 的 sources 只作用在 direct dependency 上，所以那個 pin 從未生效過。
    "torch>=2.12,<2.13",
]

[dependency-groups]
# 測試相依。先前完全沒宣告，本機 .venv 是手動裝出來的——乾淨 clone 後
# `uv sync` 跑不了測試，CI 也裝不到 pytest（加 CI 時才發現）。
# 版本對齊本機已驗證通過全套的環境。
dev = [
    "pytest>=9.1",
    # 只有測試用：tests/test_extraction_layout.py 與 tests/test_extract_facade.py 以 weasyprint
    # 現場渲染測試 PDF（含 CJK 案例，CI 以 REPORT_MARK_REQUIRE_CJK=1 封死 skip）。
    # 研報 PDF 渲染（2026-09 移除）曾把它當生產回退；現在 web 行程不再 import 它。
    "weasyprint>=69.0",
    # pytest-asyncio 曾在此，但**全 repo 零使用**：42 個測試檔走的是 stdlib 的
    # `unittest.IsolatedAsyncioTestCase`，`pytest.mark.asyncio` 與 `asyncio_mode`
    # 都是零命中。留著它會讓下一個人以為「這個 repo 的 async 測試用 pytest-asyncio」
    # 而混用兩種風格（兩者對 event loop 的處理不同，混用是 debug 地獄）。
    # 真要改用它，請整批遷移並在此重新加回。
    "ruff>=0.16",
]

[tool.uv]
# CPU-only torch；避免抓 CUDA 輪子
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# ── ruff ────────────────────────────────────────────────────────────────────
# 在此之前 Python 側完全沒有 linter，於是「死 import」「未使用的區域變數」這類
# 缺陷只能靠人眼——而本 repo 已經因為死 import 誤導過判斷（`answer.py` 頂層 import
# 了 hybrid_search 卻從不呼叫，連 CLAUDE.md 都要花一段解釋「那是死 import」）。
# CI 在 pytest 之前跑 `uv run ruff check .`。
[tool.ruff]
# 120 而非預設 88：本 repo 大量行是中文 prompt 與中文註解，88 會噴 867 筆、其中
# 87% 是 E501。那個數字不是品質訊號，只會讓人把整個 lint 關掉。
line-length = 120

[tool.ruff.lint]
# 刻意只開三組：E（pycodestyle）、F（pyflakes，死 import／未使用變數）、
# I（import 排序）。E402 全域關掉——本 repo 幾十個檔案刻意在 import 之前做
# `sys.path.insert` 或 `os.environ.setdefault`（`web/auth.py` 在 import 期就
# fail-closed 檢查帳密，所以 .env 必須更早載入），那是有理由的順序，不是風格問題。
#
# 刻意**不**啟用 `ruff format --check`：實測會要求重排 60/90 個檔（含 `web/server.py`、
# `web/routers/spa.py`），那是一次與任何行為無關的巨型 diff，會把 git blame 整片洗掉。
# 要做請另開一支只含格式化的 PR。也刻意不加 black／mypy／pre-commit。
select = ["E", "F", "I"]
extend-ignore = ["E402"]
