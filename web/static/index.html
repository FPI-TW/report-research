<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>廷豐研報</title>
<meta name="description" content="廷豐研報：研究報告語意檢索與瀏覽，依市場／商品類型／標的快速找到相關研報。" />
<meta name="theme-color" content="#f7f8fa" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23007aff'/><text x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='PingFang TC,Microsoft JhengHei,sans-serif'>研</text></svg>" />
<link rel="stylesheet" href="/static/tokens.css" />
<style>
  /* 共用色票/字體見 tokens.css；此處僅頁面專屬 token */
  :root {
    --blue-press: #0062cc;
    --blue-soft: #007aff1f;
    --side: #ffffffcc;
    --mark: #ffd60a59;
    --radius-md: 16px;
    --radius-sm: 11px;
    --sidebar-w: 296px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100dvh; color: var(--label);
    background: radial-gradient(120% 80% at 50% -10%, var(--bg-grad-1) 0%, var(--bg-grad-2) 60%, var(--bg) 100%);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    font-size: 15px; line-height: 1.5; letter-spacing: .006em;
  }

  /* ───── shell: two-pane grid ───── */
  .app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }

  .sidebar {
    position: sticky; top: 0; align-self: start;
    height: 100dvh; overflow-y: auto; scrollbar-width: thin;
    padding: max(env(safe-area-inset-top), 26px) 22px 24px;
    background: var(--side);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-right: .5px solid var(--sep);
    display: flex; flex-direction: column; gap: 20px;
  }
  h1 { margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -.022em; }
  h1 .accent { color: var(--blue); }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nav-links { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .monitor-link { display: inline-flex; align-items: center; gap: 6px; flex: none;
    font-size: 13px; font-weight: 600; color: var(--blue); background: var(--blue-soft);
    padding: 6px 12px; border-radius: 100px; text-decoration: none; white-space: nowrap;
    transition: transform .12s, background .2s; }
  .monitor-link:hover { background: #007aff2e; }
  .monitor-link:active { transform: scale(.96); }
  .monitor-link svg { flex: none; }
  .logout-form { margin: 0; display: inline-flex; }
  .logout-btn { border: none; cursor: pointer; font-family: inherit; }

  .stats { display: flex; gap: 7px; flex-wrap: wrap; }
  .stats:empty { display: none; }   /* 平常不顯示篇數/片段；僅後端未連線時才占位 */
  .pill { font-size: 12px; font-weight: 600; color: var(--label-2);
    background: var(--fill); padding: 5px 11px; border-radius: 100px; white-space: nowrap; }
  .pill b { color: var(--label); font-weight: 700; }

  .search { display: flex; flex-direction: column; gap: 9px; }
  .search-box {
    display: flex; align-items: center; gap: 9px; background: var(--card);
    border-radius: var(--radius-sm); padding: 0 12px; height: 46px;
    box-shadow: var(--shadow); transition: box-shadow .25s;
  }
  .search-box:focus-within { box-shadow: 0 0 0 4px var(--blue-soft), var(--shadow); }
  .search-box svg { flex: none; color: var(--label-3); }
  #q { border: none; outline: none; background: transparent; flex: 1; min-width: 0;
    font-size: 16px; color: var(--label); font-family: inherit; }
  #q::placeholder { color: var(--label-2); }
  .clear { border: none; background: var(--label-3); color: #fff; width: 19px; height: 19px;
    border-radius: 50%; font-size: 12px; line-height: 19px; cursor: pointer; flex: none;
    display: none; padding: 0; }
  .clear.show { display: block; }
  .go { border: none; background: var(--blue); color: #fff; font-size: 15px; font-weight: 600;
    font-family: inherit; height: 42px; width: 100%; border-radius: var(--radius-sm);
    cursor: pointer; transition: transform .12s, background .2s; }
  .go:hover { background: var(--blue-press); }
  .go:active { transform: scale(.97); }

  .filters-label { font-size: 12px; font-weight: 700; color: var(--label-3);
    letter-spacing: .04em; padding: 2px 2px 0; text-transform: none; }
  .filters { display: flex; flex-direction: column; gap: 2px; }
  .filter { display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 9px 11px; border: none; border-radius: 10px; background: transparent;
    font-size: 14px; font-weight: 600; font-family: inherit; color: var(--label);
    cursor: pointer; text-align: left; transition: background .18s, color .18s, transform .12s; }
  .filter:hover { background: var(--fill); }
  .filter:active { transform: scale(.98); }
  .filter.on { background: var(--blue-soft); color: var(--blue); }
  .filter .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .filter .nm { flex: 1; }
  .filter .ct { font-size: 12px; font-weight: 600; color: var(--label-3);
    font-variant-numeric: tabular-nums; }
  .filter.on .ct { color: var(--blue); }

  /* 桌面：群組透明（不影響原本側欄排版）；收摺鈕僅手機顯示 */
  .filter-groups { display: contents; }
  .filter-toggle { display: none; }

  /* ───── content ───── */
  .content { padding: 32px 30px 64px; }
  /* 寬螢幕收斂內容寬度，避免卡片過寬、中文長句一行字數過多難回掃 */
  .content-inner { max-width: 1480px; margin-inline: auto; }
  .meta-line { font-size: 13px; font-weight: 600; color: var(--label-2);
    margin: 2px 2px 18px; letter-spacing: .01em; display: none; }
  .meta-line.show { display: block; }

  /* 結果：自適應卡片網格（寬螢幕兩欄，窄螢幕自動收回單欄） */
  #results { display: grid; align-items: start; gap: 13px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
  #results .state, #results > .sk:first-child:last-child { grid-column: 1 / -1; }
  .state { grid-column: 1 / -1; }

  .card { background: var(--card); border-radius: var(--radius-md); padding: 17px 19px;
    box-shadow: var(--shadow);
    opacity: 0; transform: translateY(14px) scale(.99);
    animation: rise .5s cubic-bezier(.22,1,.36,1) forwards;
    transition: box-shadow .25s, transform .2s; }
  .card:hover { transform: translateY(-1px);
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 14px 34px rgba(0,0,0,.09); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .card-top { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .badge { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
    color: #fff; flex: none; letter-spacing: .01em; }
  .fname { font-size: 15.5px; font-weight: 600; color: var(--label); letter-spacing: -.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .rank { font-size: 12px; color: var(--label-3); font-weight: 600; flex: none;
    font-variant-numeric: tabular-nums; }
  .info { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 9px; margin: 0 0 13px;
    font-size: 12.5px; color: var(--label-2); }
  .info span { display: inline-flex; align-items: center; gap: 4px; }
  .info .dot { color: var(--label-3); margin: 0 1px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 13px; }
  .itag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
    color: var(--ic); background: color-mix(in srgb, var(--ic) 14%, transparent);
    letter-spacing: .01em; }
  .subj { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
    color: var(--label-2); background: var(--fill); letter-spacing: .01em; }
  .summary { font-size: 13px; line-height: 1.55; color: var(--label-2);
    margin: 0 0 13px; cursor: pointer; }
  .row-summary { font-size: 12px; line-height: 1.5; color: var(--label-2); cursor: pointer; }
  .summary.clamp, .row-summary.clamp { display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 2; overflow: hidden; }
  .summary.expanded, .row-summary.expanded { -webkit-line-clamp: unset; }
  .passages { display: flex; flex-direction: column; gap: 11px; }
  .passage { font-size: 14px; line-height: 1.62; color: var(--label-2); letter-spacing: .008em;
    padding-left: 12px; border-left: 2px solid var(--sep); }
  .passage.hidden { display: none; }
  .passage .pscore { font-size: 11px; font-weight: 700; color: var(--blue);
    font-variant-numeric: tabular-nums; margin-right: 6px; letter-spacing: 0; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .more { margin-top: 10px; border: none; background: var(--fill); color: var(--blue);
    font-size: 13px; font-weight: 600; font-family: inherit; padding: 7px 13px;
    border-radius: 100px; cursor: pointer; transition: transform .12s; }
  .more:active { transform: scale(.95); }
  .card-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .full-report { margin-top: 10px; border: none; background: var(--blue); color: #fff;
    font-size: 13px; font-weight: 600; font-family: inherit; padding: 7px 14px;
    border-radius: 100px; cursor: pointer; transition: transform .12s, opacity .12s; }
  .full-report:hover { opacity: .9; }
  .full-report:active { transform: scale(.95); }
  /* 完整報告 modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--bg); width: min(1000px, 100%); height: 90dvh;
    border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.3); }
  /* PDF 載入中覆蓋層（iframe 數 MB，內網下要數秒；避免整片深灰無回饋） */
  .pdf-wrap { position: relative; width: 100%; height: 100%; }
  .pdf-loading { position: absolute; inset: 0; display: flex; gap: 10px;
    align-items: center; justify-content: center; color: #fff; font-size: 14px; }
  .pdf-loading .spin { width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #ffffff66; border-top-color: #fff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px;
    border-bottom: 1px solid var(--sep); }
  .modal-head .m-title { flex: 1; min-width: 0; }
  .modal-head .m-name { margin: 0; font-size: 15px; font-weight: 700; color: var(--label);
    line-height: 1.4; word-break: break-all; }
  .modal-head .m-meta { font-size: 12px; color: var(--label-3); margin-top: 5px;
    display: flex; flex-wrap: wrap; gap: 4px 9px; align-items: center; }
  .modal-summary { padding: 12px 20px; border-bottom: 1px solid var(--sep);
    font-size: 13.5px; line-height: 1.6; color: var(--label-2); background: var(--card); }
  .modal-summary[hidden] { display: none; }
  .modal-close { border: none; background: var(--fill); color: var(--label-2);
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer; flex: none;
    font-size: 17px; line-height: 1; }
  .modal-body { flex: 1; min-height: 0; display: flex; overflow: hidden; background: #525659; }
  .pdf-frame { width: 100%; height: 100%; border: 0; }
  .modal-fallback { margin: auto; padding: 40px 24px; text-align: center;
    font-size: 14px; color: var(--label-3); background: var(--bg); }
  .modal-foot { padding: 13px 20px; border-top: 1px solid var(--sep);
    display: flex; justify-content: flex-end; }
  .modal-foot a { font-size: 13px; font-weight: 600; color: var(--blue); text-decoration: none;
    padding: 7px 14px; border-radius: 100px; background: var(--fill); }
  .score-row { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
  .score-track { flex: 1; height: 6px; border-radius: 100px; background: var(--fill); overflow: hidden; }
  .score-fill { height: 100%; border-radius: 100px; background: var(--blue);
    width: 0; transition: width .9s cubic-bezier(.22,1,.36,1); }
  .score-num { font-size: 12px; font-weight: 700; color: var(--label-2);
    font-variant-numeric: tabular-nums; flex: none; }

  .sk { background: var(--card); border-radius: var(--radius-md); padding: 16px 18px;
    box-shadow: var(--shadow); }
  .sk-line { height: 12px; border-radius: 6px; margin: 8px 0;
    background: linear-gradient(90deg, #ececf0 25%, #f5f5f8 37%, #ececf0 63%);
    background-size: 400% 100%; animation: shimmer 1.3s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  .state { text-align: center; padding: 64px 24px; color: var(--label-3); }
  .state .big { font-size: 34px; margin-bottom: 10px; }
  .state .msg { font-size: 15px; color: var(--label-2); }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .ex { font-size: 13px; font-weight: 500; color: var(--blue);
    background: var(--blue-soft); padding: 7px 13px; border-radius: 100px; cursor: pointer;
    border: none; font-family: inherit; transition: transform .15s; }
  .ex:active { transform: scale(.93); }
  /* 搜尋框下方的範例查詢（協助新使用者上手） */
  .search-examples { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
  .search-examples .ex-label { font-size: 12px; font-weight: 600; color: var(--label-3); }

  /* ───── 結果列工具列 + 檢視切換 ───── */
  .results-bar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
    margin: 0 2px 16px; }
  .results-bar[hidden] { display: none; }
  .view-switch { display: inline-flex; background: var(--fill); border-radius: 10px; padding: 3px; gap: 2px; }
  .view-switch button { border: none; background: transparent; font-family: inherit;
    font-size: 13px; font-weight: 600; color: var(--label-2); padding: 6px 14px;
    border-radius: 8px; cursor: pointer; white-space: nowrap;
    transition: background .18s, color .18s; }
  .view-switch button:hover { color: var(--label); }
  .view-switch button[aria-checked="true"] { background: var(--card); color: var(--label);
    box-shadow: var(--shadow); }
  .group-by-wrap { display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: var(--label-2); }
  .group-by-wrap[hidden] { display: none; }
  .group-by-wrap select { font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--label); background: var(--card); border: .5px solid var(--sep);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .view-note { font-size: 12px; color: var(--label-3); flex: 1 1 100%; }
  .view-note:empty { display: none; }

  /* 檢視模式：覆寫 #results 預設網格（specificity 高於 #results） */
  #results.mode-list, #results.mode-group { display: block; }
  #results.mode-table { display: block; overflow-x: auto; }
  #results.no-rise .card { animation: none; opacity: 1; transform: none; }
  #results.no-rise .score-fill { transition: none; }

  /* 緊湊列表 / 分組列 */
  .row { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    background: var(--card); border: none; border-radius: var(--radius-sm);
    box-shadow: var(--shadow); padding: 11px 14px; margin-bottom: 8px; cursor: pointer;
    font-family: inherit; color: var(--label); transition: box-shadow .2s, transform .12s; }
  .row:hover { transform: translateY(-1px);
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 24px rgba(0,0,0,.08); }
  .row:active { transform: scale(.997); }
  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row-name { font-size: 14.5px; font-weight: 600; color: var(--label);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-meta { font-size: 12px; color: var(--label-2); display: flex; flex-wrap: wrap;
    align-items: center; gap: 3px 7px; }
  .row-meta .dot { color: var(--label-3); }
  .row .tags { margin: 2px 0 0; }
  .row-score { font-size: 12px; font-weight: 700; color: var(--blue); flex: none;
    font-variant-numeric: tabular-nums; }

  /* 表格 */
  .rtable { width: 100%; border-collapse: collapse; background: var(--card);
    border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow); font-size: 13px; }
  .rtable th, .rtable td { padding: 10px 12px; text-align: left; vertical-align: middle;
    border-bottom: .5px solid var(--sep); }
  .rtable thead th { position: sticky; top: 0; background: var(--card); z-index: 1;
    font-size: 12px; font-weight: 700; color: var(--label-2); white-space: nowrap; }
  .rtable th.sortable { cursor: pointer; user-select: none; }
  .rtable th.sortable:hover { color: var(--label); }
  .rtable tbody tr { cursor: pointer; transition: background .15s; }
  .rtable tbody tr:hover { background: var(--fill); }
  .rtable tbody tr:last-child td { border-bottom: none; }
  .rtable .t-name { max-width: 360px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 600; color: var(--label); }
  .rtable .t-date { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--label-2); }
  .rtable .t-targets { max-width: 220px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--label-2); }
  .rtable .t-num { text-align: right; font-variant-numeric: tabular-nums; color: var(--label-2); }
  .rtable .badge { font-size: 11px; padding: 2px 7px; white-space: nowrap; }

  /* 分組 */
  .group { margin-bottom: 18px; }
  .group-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
    padding: 7px 4px; margin-bottom: 8px;
    background: linear-gradient(var(--bg-grad-1), var(--bg-grad-1) 70%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .group-head .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .group-name { font-size: 14px; font-weight: 700; color: var(--label); }
  .group-ct { font-size: 12px; font-weight: 600; color: var(--label-3); background: var(--fill);
    padding: 2px 9px; border-radius: 100px; font-variant-numeric: tabular-nums; }

  .load-more-wrap { grid-column: 1 / -1; text-align: center; padding: 8px 0 2px; }

  /* ───── mobile: collapse to single column ───── */
  @media (max-width: 880px) {
    .app { display: block; }
    .sidebar { position: sticky; top: 0; height: auto; overflow: visible;
      flex-direction: column; gap: 13px; z-index: 30;
      padding: max(env(safe-area-inset-top), 14px) 16px 12px; }
    .topbar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 12px; }
    .brand { flex: 1 1 100%; }
    h1 { font-size: 22px; white-space: nowrap; }
    .search { flex-direction: row; }
    .go { width: auto; flex: none; padding: 0 18px; height: 46px; }
    /* 手機：篩選收進「篩選與排序」收摺面板，首屏直接看到報告卡片 */
    .filter-toggle { display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 11px 14px; border: .5px solid var(--sep); border-radius: 12px;
      background: var(--card); box-shadow: var(--shadow); font-family: inherit; font-weight: 600;
      font-size: 14px; color: var(--label); cursor: pointer; }
    .filter-toggle::after { content: "▾"; color: var(--label-3); font-size: 12px; }
    .filter-toggle[aria-expanded="true"]::after { content: "▴"; }
    .filter-groups { display: none; flex-direction: column; gap: 12px; }
    .filter-groups.open { display: flex; }
    /* 收摺面板內保留精簡分類標題，避免 chip 列失去脈絡 */
    .filters-label { display: block; font-size: 11px; font-weight: 700;
      color: var(--label-3); letter-spacing: .04em; padding: 0; margin: 4px 2px 0; }
    .filters { flex-direction: row; overflow-x: auto; gap: 8px; scrollbar-width: none;
      margin: 0 -16px; padding: 0 16px 2px; }
    .filters::-webkit-scrollbar { display: none; }
    .filter { width: auto; flex: none; background: var(--card); border: .5px solid var(--sep);
      border-radius: 100px; padding: 8px 14px; }
    .filter.on { background: var(--blue); color: #fff; border-color: transparent; }
    .filter.on .ct { color: #ffffffcc; }
    .filter .dot { display: none; }
    .content { padding: 16px 16px 50px; }
    .card { padding: 14px 15px; }
    .search-examples { display: none; }
    /* 檢視切換：手機改為整列等寬分段，分組依據另起一行 */
    .results-bar { margin: 0 0 12px; }
    .view-switch { width: 100%; }
    .view-switch button { flex: 1; text-align: center; padding: 7px 4px; }
    /* 手機表格：給最小寬度以觸發橫向捲動，欄位才不會被擠壓換行 */
    .rtable { min-width: 580px; }
    .rtable .t-name { max-width: 200px; }
  }
  @media (min-width: 881px) {
    .topbar { display: contents; }

    </aside>

    <main class="content">
      <div class="content-inner">
        <div class="meta-line" id="meta" aria-live="polite"></div>
        <div class="results-bar" id="resultsBar" hidden>
          <div class="view-switch" role="radiogroup" aria-label="檢視方式">
            <button type="button" role="radio" data-view="grid" aria-checked="true" aria-label="卡片檢視">卡片</button>
            <button type="button" role="radio" data-view="list" aria-checked="false" aria-label="列表檢視">列表</button>
            <button type="button" role="radio" data-view="table" aria-checked="false" aria-label="表格檢視">表格</button>
            <button type="button" role="radio" data-view="group" aria-checked="false" aria-label="分組檢視">分組</button>
          </div>
          <div class="group-by-wrap" id="groupByWrap" hidden>
            <label for="groupBy">分組依據</label>
            <select id="groupBy" aria-label="分組依據">
              <option value="market">市場</option>
              <option value="report_type">報告類型</option>
              <option value="month">日期(月)</option>
            </select>
          </div>
          <button class="clear-filters" id="clearFilters" type="button" hidden>清除篩選</button>
          <div class="view-note" id="viewNote" aria-live="polite"></div>
        </div>
        <div id="results" role="region" aria-label="研報結果"></div>
        <div class="ask-panel" id="askPanel" hidden>
          <div class="ask-thread" id="askThread">
            <div class="ask-thread-inner">
              <div class="ask-empty" id="askEmpty">
                <div class="ask-empty-title">向研報語料提問</div>
                <div class="ask-empty-sub">用自然語言提問，回答會引用並可點開原始報告。</div>
                <div class="ask-examples" id="askExamples">
                  <button class="ex" type="button">AI 伺服器的最新發展</button>
                  <button class="ex" type="button">台積電先進封裝</button>
                  <button class="ex" type="button">美國升息的影響</button>
                </div>
              </div>
              <div class="ask-msg-user" id="askQuestion" hidden></div>
              <div class="ask-msg-bot" id="askAnswer" aria-live="polite" hidden></div>
              <div class="ask-actions" id="askActions" hidden></div>
              <div class="ask-sources" id="askSources"></div>
              <div class="ask-sources ask-ext-list" id="askExtSources"></div>
            </div>
          </div>
          <div class="ask-composer">
            <div class="ask-composer-inner">
              <button class="ask-hist-btn" id="askHistBtn" type="button" title="歷史問答" aria-label="歷史問答">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 2"/></svg>
              </button>
              <textarea id="askInput" class="ask-input" rows="1"
                placeholder="輸入你的問題…" aria-label="輸入問題"></textarea>
              <button class="ask-go" id="askGo" type="button">提問</button>
            </div>
          </div>
          <div class="ask-hist-drawer" id="askHistDrawer" hidden>
            <div class="ask-hist-backdrop" id="askHistBackdrop"></div>
            <aside class="ask-hist-panel" role="dialog" aria-modal="true" aria-label="歷史問答">
              <div class="ask-hist-head">
                <span class="ask-hist-title">歷史問答</span>
                <button class="ask-hist-close" id="askHistClose" type="button" aria-label="關閉歷史">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </div>
              <div class="ask-hist-list" id="askHistList"></div>
            </aside>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <div class="modal-head">
        <div class="m-title">
          <h2 class="m-name" id="modalName"></h2>
          <div class="m-meta" id="modalMeta"></div>
        </div>
        <button class="modal-close" id="modalClose" aria-label="關閉">✕</button>
      </div>
      <div class="modal-summary" id="modalSummary" hidden></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

<script type="module" src="/static/app/main.js"></script>
</body>
</html>
