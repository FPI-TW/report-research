<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>廷豐研報</title>
<meta name="description" content="廷豐研報：研究報告語意檢索與瀏覽，依市場／商品類型／標的快速找到相關研報。" />
<meta name="theme-color" content="#f7f8fa" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23007aff'/><text x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='PingFang TC,Microsoft JhengHei,sans-serif'>研</text></svg>" />
<link rel="stylesheet" href="/static/tokens.css" />
<style>
  /* 共用色票/字體見 tokens.css；此處僅頁面專屬 token */
  :root {
    --blue-press: #0062cc;
    --blue-soft: #007aff1f;
    --side: #ffffffcc;
    --mark: #ffd60a59;
    --radius-md: 16px;
    --radius-sm: 11px;
    --sidebar-w: 296px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100dvh; color: var(--label);
    background: radial-gradient(120% 80% at 50% -10%, var(--bg-grad-1) 0%, var(--bg-grad-2) 60%, var(--bg) 100%);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    font-size: 15px; line-height: 1.5; letter-spacing: .006em;
  }

  /* ───── shell: two-pane grid ───── */
  .app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }

  .sidebar {
    position: sticky; top: 0; align-self: start;
    height: 100dvh; overflow-y: auto; scrollbar-width: thin;
    padding: max(env(safe-area-inset-top), 26px) 22px 24px;
    background: var(--side);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-right: .5px solid var(--sep);
    display: flex; flex-direction: column; gap: 20px;
  }
  h1 { margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -.022em; }
  h1 .accent { color: var(--blue); }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nav-links { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .monitor-link { display: inline-flex; align-items: center; gap: 6px; flex: none;
    font-size: 13px; font-weight: 600; color: var(--blue); background: var(--blue-soft);
    padding: 6px 12px; border-radius: 100px; text-decoration: none; white-space: nowrap;
    transition: transform .12s, background .2s; }
  .monitor-link:hover { background: #007aff2e; }
  .monitor-link:active { transform: scale(.96); }
  .monitor-link svg { flex: none; }

  .stats { display: flex; gap: 7px; flex-wrap: wrap; }
  .stats:empty { display: none; }   /* 平常不顯示篇數/片段；僅後端未連線時才占位 */
  .pill { font-size: 12px; font-weight: 600; color: var(--label-2);
    background: var(--fill); padding: 5px 11px; border-radius: 100px; white-space: nowrap; }
  .pill b { color: var(--label); font-weight: 700; }

  .search { display: flex; flex-direction: column; gap: 9px; }
  .search-box {
    display: flex; align-items: center; gap: 9px; background: var(--card);
    border-radius: var(--radius-sm); padding: 0 12px; height: 46px;
    box-shadow: var(--shadow); transition: box-shadow .25s;
  }
  .search-box:focus-within { box-shadow: 0 0 0 4px var(--blue-soft), var(--shadow); }
  .search-box svg { flex: none; color: var(--label-3); }
  #q { border: none; outline: none; background: transparent; flex: 1; min-width: 0;
    font-size: 16px; color: var(--label); font-family: inherit; }
  #q::placeholder { color: var(--label-2); }
  .clear { border: none; background: var(--label-3); color: #fff; width: 19px; height: 19px;
    border-radius: 50%; font-size: 12px; line-height: 19px; cursor: pointer; flex: none;
    display: none; padding: 0; }
  .clear.show { display: block; }
  .go { border: none; background: var(--blue); color: #fff; font-size: 15px; font-weight: 600;
    font-family: inherit; height: 42px; width: 100%; border-radius: var(--radius-sm);
    cursor: pointer; transition: transform .12s, background .2s; }
  .go:hover { background: var(--blue-press); }
  .go:active { transform: scale(.97); }

  .filters-label { font-size: 12px; font-weight: 700; color: var(--label-3);
    letter-spacing: .04em; padding: 2px 2px 0; text-transform: none; }
  .filters { display: flex; flex-direction: column; gap: 2px; }
  .filter { display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 9px 11px; border: none; border-radius: 10px; background: transparent;
    font-size: 14px; font-weight: 600; font-family: inherit; color: var(--label);
    cursor: pointer; text-align: left; transition: background .18s, color .18s, transform .12s; }
  .filter:hover { background: var(--fill); }
  .filter:active { transform: scale(.98); }
  .filter.on { background: var(--blue-soft); color: var(--blue); }
  .filter .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .filter .nm { flex: 1; }
  .filter .ct { font-size: 12px; font-weight: 600; color: var(--label-3);
    font-variant-numeric: tabular-nums; }
  .filter.on .ct { color: var(--blue); }

  /* 桌面：群組透明（不影響原本側欄排版）；收摺鈕僅手機顯示 */
  .filter-groups { display: contents; }
  .filter-toggle { display: none; }

  /* ───── content ───── */
  .content { padding: 32px 30px 64px; }
  /* 寬螢幕收斂內容寬度，避免卡片過寬、中文長句一行字數過多難回掃 */
  .content-inner { max-width: 1480px; margin-inline: auto; }
  .meta-line { font-size: 13px; font-weight: 600; color: var(--label-2);
    margin: 2px 2px 18px; letter-spacing: .01em; display: none; }
  .meta-line.show { display: block; }

  /* 結果：自適應卡片網格（寬螢幕兩欄，窄螢幕自動收回單欄） */
  #results { display: grid; align-items: start; gap: 13px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
  #results .state, #results > .sk:first-child:last-child { grid-column: 1 / -1; }
  .state { grid-column: 1 / -1; }

  .card { background: var(--card); border-radius: var(--radius-md); padding: 17px 19px;
    box-shadow: var(--shadow);
    opacity: 0; transform: translateY(14px) scale(.99);
    animation: rise .5s cubic-bezier(.22,1,.36,1) forwards;
    transition: box-shadow .25s, transform .2s; }
  .card:hover { transform: translateY(-1px);
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 14px 34px rgba(0,0,0,.09); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .card-top { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .badge { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
    color: #fff; flex: none; letter-spacing: .01em; }
  .fname { font-size: 15.5px; font-weight: 600; color: var(--label); letter-spacing: -.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .rank { font-size: 12px; color: var(--label-3); font-weight: 600; flex: none;
    font-variant-numeric: tabular-nums; }
  .info { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 9px; margin: 0 0 13px;
    font-size: 12.5px; color: var(--label-2); }
  .info span { display: inline-flex; align-items: center; gap: 4px; }
  .info .dot { color: var(--label-3); margin: 0 1px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 13px; }
  .itag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
    color: var(--ic); background: color-mix(in srgb, var(--ic) 14%, transparent);
    letter-spacing: .01em; }
  .subj { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
    color: var(--label-2); background: var(--fill); letter-spacing: .01em; }
  .summary { font-size: 13px; line-height: 1.55; color: var(--label-2);
    margin: 0 0 13px; cursor: pointer; }
  .row-summary { font-size: 12px; line-height: 1.5; color: var(--label-2); cursor: pointer; }
  .summary.clamp, .row-summary.clamp { display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 2; overflow: hidden; }
  .summary.expanded, .row-summary.expanded { -webkit-line-clamp: unset; }
  .passages { display: flex; flex-direction: column; gap: 11px; }
  .passage { font-size: 14px; line-height: 1.62; color: var(--label-2); letter-spacing: .008em;
    padding-left: 12px; border-left: 2px solid var(--sep); }
  .passage.hidden { display: none; }
  .passage .pscore { font-size: 11px; font-weight: 700; color: var(--blue);
    font-variant-numeric: tabular-nums; margin-right: 6px; letter-spacing: 0; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .more { margin-top: 10px; border: none; background: var(--fill); color: var(--blue);
    font-size: 13px; font-weight: 600; font-family: inherit; padding: 7px 13px;
    border-radius: 100px; cursor: pointer; transition: transform .12s; }
  .more:active { transform: scale(.95); }
  .card-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .full-report { margin-top: 10px; border: none; background: var(--blue); color: #fff;
    font-size: 13px; font-weight: 600; font-family: inherit; padding: 7px 14px;
    border-radius: 100px; cursor: pointer; transition: transform .12s, opacity .12s; }
  .full-report:hover { opacity: .9; }
  .full-report:active { transform: scale(.95); }
  /* 完整報告 modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--bg); width: min(1000px, 100%); height: 90dvh;
    border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.3); }
  /* PDF 載入中覆蓋層（iframe 數 MB，內網下要數秒；避免整片深灰無回饋） */
  .pdf-wrap { position: relative; width: 100%; height: 100%; }
  .pdf-loading { position: absolute; inset: 0; display: flex; gap: 10px;
    align-items: center; justify-content: center; color: #fff; font-size: 14px; }
  .pdf-loading .spin { width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #ffffff66; border-top-color: #fff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px;
    border-bottom: 1px solid var(--sep); }
  .modal-head .m-title { flex: 1; min-width: 0; }
  .modal-head .m-name { margin: 0; font-size: 15px; font-weight: 700; color: var(--label);
    line-height: 1.4; word-break: break-all; }
  .modal-head .m-meta { font-size: 12px; color: var(--label-3); margin-top: 5px;
    display: flex; flex-wrap: wrap; gap: 4px 9px; align-items: center; }
  .modal-summary { padding: 12px 20px; border-bottom: 1px solid var(--sep);
    font-size: 13.5px; line-height: 1.6; color: var(--label-2); background: var(--card); }
  .modal-summary[hidden] { display: none; }
  .modal-close { border: none; background: var(--fill); color: var(--label-2);
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer; flex: none;
    font-size: 17px; line-height: 1; }
  .modal-body { flex: 1; min-height: 0; display: flex; overflow: hidden; background: #525659; }
  .pdf-frame { width: 100%; height: 100%; border: 0; }
  .modal-fallback { margin: auto; padding: 40px 24px; text-align: center;
    font-size: 14px; color: var(--label-3); background: var(--bg); }
  .modal-foot { padding: 13px 20px; border-top: 1px solid var(--sep);
    display: flex; justify-content: flex-end; }
  .modal-foot a { font-size: 13px; font-weight: 600; color: var(--blue); text-decoration: none;
    padding: 7px 14px; border-radius: 100px; background: var(--fill); }
  .score-row { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
  .score-track { flex: 1; height: 6px; border-radius: 100px; background: var(--fill); overflow: hidden; }
  .score-fill { height: 100%; border-radius: 100px; background: var(--blue);
    width: 0; transition: width .9s cubic-bezier(.22,1,.36,1); }
  .score-num { font-size: 12px; font-weight: 700; color: var(--label-2);
    font-variant-numeric: tabular-nums; flex: none; }

  .sk { background: var(--card); border-radius: var(--radius-md); padding: 16px 18px;
    box-shadow: var(--shadow); }
  .sk-line { height: 12px; border-radius: 6px; margin: 8px 0;
    background: linear-gradient(90deg, #ececf0 25%, #f5f5f8 37%, #ececf0 63%);
    background-size: 400% 100%; animation: shimmer 1.3s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  .state { text-align: center; padding: 64px 24px; color: var(--label-3); }
  .state .big { font-size: 34px; margin-bottom: 10px; }
  .state .msg { font-size: 15px; color: var(--label-2); }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .ex { font-size: 13px; font-weight: 500; color: var(--blue);
    background: var(--blue-soft); padding: 7px 13px; border-radius: 100px; cursor: pointer;
    border: none; font-family: inherit; transition: transform .15s; }
  .ex:active { transform: scale(.93); }
  /* 搜尋框下方的範例查詢（協助新使用者上手） */
  .search-examples { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
  .search-examples .ex-label { font-size: 12px; font-weight: 600; color: var(--label-3); }

  /* ───── 結果列工具列 + 檢視切換 ───── */
  .results-bar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
    margin: 0 2px 16px; }
  .results-bar[hidden] { display: none; }
  .view-switch { display: inline-flex; background: var(--fill); border-radius: 10px; padding: 3px; gap: 2px; }
  .view-switch button { border: none; background: transparent; font-family: inherit;
    font-size: 13px; font-weight: 600; color: var(--label-2); padding: 6px 14px;
    border-radius: 8px; cursor: pointer; white-space: nowrap;
    transition: background .18s, color .18s; }
  .view-switch button:hover { color: var(--label); }
  .view-switch button[aria-checked="true"] { background: var(--card); color: var(--label);
    box-shadow: var(--shadow); }
  .group-by-wrap { display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: var(--label-2); }
  .group-by-wrap[hidden] { display: none; }
  .group-by-wrap select { font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--label); background: var(--card); border: .5px solid var(--sep);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .view-note { font-size: 12px; color: var(--label-3); flex: 1 1 100%; }
  .view-note:empty { display: none; }

  /* 檢視模式：覆寫 #results 預設網格（specificity 高於 #results） */
  #results.mode-list, #results.mode-group { display: block; }
  #results.mode-table { display: block; overflow-x: auto; }
  #results.no-rise .card { animation: none; opacity: 1; transform: none; }
  #results.no-rise .score-fill { transition: none; }

  /* 緊湊列表 / 分組列 */
  .row { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    background: var(--card); border: none; border-radius: var(--radius-sm);
    box-shadow: var(--shadow); padding: 11px 14px; margin-bottom: 8px; cursor: pointer;
    font-family: inherit; color: var(--label); transition: box-shadow .2s, transform .12s; }
  .row:hover { transform: translateY(-1px);
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 24px rgba(0,0,0,.08); }
  .row:active { transform: scale(.997); }
  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row-name { font-size: 14.5px; font-weight: 600; color: var(--label);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-meta { font-size: 12px; color: var(--label-2); display: flex; flex-wrap: wrap;
    align-items: center; gap: 3px 7px; }
  .row-meta .dot { color: var(--label-3); }
  .row .tags { margin: 2px 0 0; }
  .row-score { font-size: 12px; font-weight: 700; color: var(--blue); flex: none;
    font-variant-numeric: tabular-nums; }

  /* 表格 */
  .rtable { width: 100%; border-collapse: collapse; background: var(--card);
    border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow); font-size: 13px; }
  .rtable th, .rtable td { padding: 10px 12px; text-align: left; vertical-align: middle;
    border-bottom: .5px solid var(--sep); }
  .rtable thead th { position: sticky; top: 0; background: var(--card); z-index: 1;
    font-size: 12px; font-weight: 700; color: var(--label-2); white-space: nowrap; }
  .rtable th.sortable { cursor: pointer; user-select: none; }
  .rtable th.sortable:hover { color: var(--label); }
  .rtable tbody tr { cursor: pointer; transition: background .15s; }
  .rtable tbody tr:hover { background: var(--fill); }
  .rtable tbody tr:last-child td { border-bottom: none; }
  .rtable .t-name { max-width: 360px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 600; color: var(--label); }
  .rtable .t-date { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--label-2); }
  .rtable .t-targets { max-width: 220px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--label-2); }
  .rtable .t-num { text-align: right; font-variant-numeric: tabular-nums; color: var(--label-2); }
  .rtable .badge { font-size: 11px; padding: 2px 7px; white-space: nowrap; }

  /* 分組 */
  .group { margin-bottom: 18px; }
  .group-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
    padding: 7px 4px; margin-bottom: 8px;
    background: linear-gradient(var(--bg-grad-1), var(--bg-grad-1) 70%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .group-head .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .group-name { font-size: 14px; font-weight: 700; color: var(--label); }
  .group-ct { font-size: 12px; font-weight: 600; color: var(--label-3); background: var(--fill);
    padding: 2px 9px; border-radius: 100px; font-variant-numeric: tabular-nums; }

  .load-more-wrap { grid-column: 1 / -1; text-align: center; padding: 8px 0 2px; }

  /* ───── mobile: collapse to single column ───── */
  @media (max-width: 880px) {
    .app { display: block; }
    .sidebar { position: sticky; top: 0; height: auto; overflow: visible;
      flex-direction: column; gap: 13px; z-index: 30;
      padding: max(env(safe-area-inset-top), 14px) 16px 12px; }
    .topbar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 12px; }
    .brand { flex: 1 1 100%; }
    h1 { font-size: 22px; white-space: nowrap; }
    .search { flex-direction: row; }
    .go { width: auto; flex: none; padding: 0 18px; height: 46px; }
    /* 手機：篩選收進「篩選與排序」收摺面板，首屏直接看到報告卡片 */
    .filter-toggle { display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 11px 14px; border: .5px solid var(--sep); border-radius: 12px;
      background: var(--card); box-shadow: var(--shadow); font-family: inherit; font-weight: 600;
      font-size: 14px; color: var(--label); cursor: pointer; }
    .filter-toggle::after { content: "▾"; color: var(--label-3); font-size: 12px; }
    .filter-toggle[aria-expanded="true"]::after { content: "▴"; }
    .filter-groups { display: none; flex-direction: column; gap: 12px; }
    .filter-groups.open { display: flex; }
    /* 收摺面板內保留精簡分類標題，避免 chip 列失去脈絡 */
    .filters-label { display: block; font-size: 11px; font-weight: 700;
      color: var(--label-3); letter-spacing: .04em; padding: 0; margin: 4px 2px 0; }
    .filters { flex-direction: row; overflow-x: auto; gap: 8px; scrollbar-width: none;
      margin: 0 -16px; padding: 0 16px 2px; }
    .filters::-webkit-scrollbar { display: none; }
    .filter { width: auto; flex: none; background: var(--card); border: .5px solid var(--sep);
      border-radius: 100px; padding: 8px 14px; }
    .filter.on { background: var(--blue); color: #fff; border-color: transparent; }
    .filter.on .ct { color: #ffffffcc; }
    .filter .dot { display: none; }
    .content { padding: 16px 16px 50px; }
    .card { padding: 14px 15px; }
    .search-examples { display: none; }
    /* 檢視切換：手機改為整列等寬分段，分組依據另起一行 */
    .results-bar { margin: 0 0 12px; }
    .view-switch { width: 100%; }
    .view-switch button { flex: 1; text-align: center; padding: 7px 4px; }
    /* 手機表格：給最小寬度以觸發橫向捲動，欄位才不會被擠壓換行 */
    .rtable { min-width: 580px; }
    .rtable .t-name { max-width: 200px; }
  }
  @media (min-width: 881px) {
    .topbar { display: contents; }
    /* 窄側欄：標題獨佔一行、按鈕列移到其下方左對齊，避免擠到標題換行 */
    .brand { flex-direction: column; align-items: flex-start; gap: 10px; }
    .nav-links { width: 100%; justify-content: flex-start; }
  }
  /* 尊重系統「減少動態效果」偏好 */
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none !important; opacity: 1; transform: none; }
    .score-fill { transition: none; }
    .sk-line { animation: none; }
    .go, .more, .ex, .full-report, .filter, .monitor-link, .card { transition: none; }
    .row { transition: none; }
    .view-switch button { transition: none; }
  }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ───── 跳至結果（鍵盤使用者免 Tab 穿整個側欄）───── */
  .skip-link { position: absolute; left: 8px; top: -48px; z-index: 60;
    background: var(--blue); color: #fff; font-weight: 600; font-size: 13px;
    padding: 9px 14px; border-radius: 10px; text-decoration: none;
    transition: top .15s; }
  .skip-link:focus { top: 8px; }

  /* ───── 常駐「清除篩選」（套用篩選時隨時可一鍵還原）───── */
  .clear-filters { border: none; background: var(--fill); color: var(--label-2);
    font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    padding: 6px 12px; border-radius: 100px; display: inline-flex; align-items: center; gap: 5px; }
  .clear-filters[hidden] { display: none; }
  .clear-filters:hover { background: #78788024; color: var(--label); }
  .clear-filters::before { content: "✕"; font-size: 10px; }

  /* ───── 摘要展開鈕（僅實際溢出時由 JS 加上；鍵盤可用）───── */
  .sum-toggle { border: none; background: none; color: var(--blue); cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 600; padding: 2px 0; margin: 1px 0 2px; }
  .row .sum-toggle { margin: 0; }
  .sum-toggle:hover { text-decoration: underline; }

  /* ───── 瀏覽模式整卡可點（與列表一致；密度更高、CTA 不再搶眼）───── */
  .card.card-click { cursor: pointer; }
  .card.card-click:active { transform: scale(.997); }

  /* ───── 平板／半螢幕：縮窄側欄讓第二欄卡片出得來 ───── */
  @media (min-width: 881px) and (max-width: 1040px) {
    :root { --sidebar-w: 232px; }
  }

  /* ───── 手機補強：側欄不黏（消除與 sticky 表頭/分組標題重疊）、全螢幕 modal ───── */
  @media (max-width: 880px) {
    .sidebar { position: static; }
    .modal-backdrop { padding: 0; }
    .modal { width: 100%; height: 100dvh; border-radius: 0; }
  }

  /* ───── 觸控裝置：放大過小的點擊目標到 ~44px ───── */
  @media (pointer: coarse) {
    .clear { width: 26px; height: 26px; line-height: 26px; font-size: 13px; }
    .modal-close { width: 40px; height: 40px; font-size: 18px; }
    .view-switch button { padding: 11px 14px; }
    .filter { padding: 11px 14px; }
  }
</style>

<script src="/static/utils.js"></script>
<script>
// 市場標籤對齊 findb 代碼；顯示中文名 + 配色
const MARKET_META = {
  TW:{label:"台股",color:"#34c759"}, US:{label:"美股",color:"#007aff"},
  HK:{label:"港股",color:"#ff9500"}, CN:{label:"陸股",color:"#ff3b30"},
  FX:{label:"外匯",color:"#00c7be"}, WTX:{label:"台指期",color:"#af52de"},
  MACRO:{label:"總經",color:"#ff2d55"}, GLOBAL:{label:"全球",color:"#5856d6"},
  CRYPTO:{label:"加密",color:"#a2845e"}
};
const mLabel = c => (MARKET_META[c] && MARKET_META[c].label) || c || "—";
const mColor = c => (MARKET_META[c] && MARKET_META[c].color) || "#8e8e93";

// 商品類型詞表：中文 label + 配色（對齊 tagging.py INSTRUMENT_DISPLAY）
const INSTRUMENT_META = {
  equity:{label:"股票",color:"#0a84ff"}, index:{label:"指數",color:"#5e5ce6"},
  futures:{label:"期貨",color:"#ff9f0a"}, options:{label:"選擇權",color:"#bf5af2"},
  etf:{label:"ETF",color:"#30d158"}, bond:{label:"債券",color:"#0bb8c4"},
  fx:{label:"外匯",color:"#00c7be"}, commodity:{label:"原物料",color:"#ac8e68"},
  crypto:{label:"加密",color:"#e0a400"}
};
const iLabel = c => (INSTRUMENT_META[c] && INSTRUMENT_META[c].label) || c || "—";
const iColor = c => (INSTRUMENT_META[c] && INSTRUMENT_META[c].color) || "#8e8e93";
// ── 單一狀態物件：使用者意圖（可分享/可還原）＋ 目前結果快取，集中管理避免多處走樣 ──
const VIEWS = ["grid", "list", "table", "group"];
const GROUPS = ["market", "report_type", "month"];
const state = {
  // 篩選 / 排序 / 檢視意圖
  market: "全部", instrument: "全部", relStock: false, relFutures: false,
  type: "全部",
  sort: "date_desc",            // 初值對齊首屏瀏覽預設，避免載入時 chip 自跳
  view: "grid", group: "market",
  tableSort: { key: null, dir: "asc" },
  lastQuery: "",
  // 目前結果快取：切換檢視時免重打 API（search: results；browse: 累積 items）
  rows: [], mode: "browse", terms: [], total: 0, offset: 0,
  // 非同步請求序號：search / browse 各自獨立，最新者勝（避免兩流互相干擾）
  searchReq: 0, browseReq: 0,
};
try { const v = localStorage.getItem("rm_view"); if (VIEWS.includes(v)) state.view = v; } catch (e) {}

// ── URL 狀態同步：讓搜尋／篩選／排序可分享、F5 重整可還原 ──
function syncURL() {
  const p = new URLSearchParams();
  const q = $("#q").value.trim();
  if (q) p.set("q", q);
  if (state.market !== "全部") p.set("market", state.market);
  if (state.instrument !== "全部") p.set("instrument", state.instrument);
  if (state.relStock) p.set("stock", "1");
  if (state.relFutures) p.set("futures", "1");
  if (state.type !== "全部") p.set("type", state.type);
  if (state.sort) p.set("sort", state.sort);
  if (state.view !== "grid") p.set("view", state.view);
  if (state.view === "group" && state.group !== "market") p.set("group", state.group);
  const qs = p.toString();
  history.replaceState(null, "", qs ? "?" + qs : location.pathname);
  updateFilterToggle();
}
function restoreFromURL() {
  const p = new URLSearchParams(location.search);
  if (p.get("market")) state.market = p.get("market");
  if (p.get("instrument")) state.instrument = p.get("instrument");
  state.relStock = p.get("stock") === "1";
  state.relFutures = p.get("futures") === "1";
  if (p.get("type")) state.type = p.get("type");
  if (p.get("sort")) state.sort = p.get("sort");
  if (VIEWS.includes(p.get("view"))) state.view = p.get("view");
  if (GROUPS.includes(p.get("group"))) state.group = p.get("group");
  const q = p.get("q");
  if (q) { $("#q").value = q; toggleClear(); }
  return !!q;
}
// 目前生效的篩選維度數（手機收摺鈕與常駐「清除篩選」共用）
function activeFilterCount() {
  let n = 0;
  if (state.market !== "全部") n++;
  if (state.instrument !== "全部") n++;
  if (state.relStock) n++;
  if (state.relFutures) n++;
  if (state.type !== "全部") n++;
  return n;
}
// 手機收摺鈕：顯示目前生效的篩選數，收起時也看得出有沒有套用篩選
function updateFilterToggle() {
  const t = $("#filterToggle");
  if (!t) return;
  const n = activeFilterCount();
  t.textContent = n ? `篩選與排序 · ${n}` : "篩選與排序";
}
// 一鍵清除所有篩選（供無結果補救用），同步 chip 視覺與 aria
function resetFilters() {
  state.market = "全部"; state.instrument = "全部"; state.type = "全部";
  state.relStock = false; state.relFutures = false;
  document.querySelectorAll("#chips .filter").forEach(x => x.classList.toggle("on", x.dataset.m === "全部"));
  document.querySelectorAll("#instrChips .filter").forEach(x => x.classList.toggle("on", x.dataset.i === "全部"));
  document.querySelectorAll("#typeChips .filter").forEach(x => x.classList.toggle("on", x.dataset.rt === "全部"));
  document.querySelectorAll("#subjToggles .filter").forEach(x => x.classList.remove("on"));
  ["#chips", "#instrChips", "#typeChips", "#subjToggles"].forEach(syncPressed);
}

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
// esc / escRe / fetchJSON / html / raw / joinHtml 來自 utils.js（共用）

// 篩選/排序變動後，依目前是否有查詢決定重跑搜尋或瀏覽（集中一處，新增維度免到處改）
function rerun() { $("#q").value.trim() ? run() : loadBrowse(); }

function buildTerms(q) {
  const terms = new Set();
  q.split(/\s+/).forEach(tok => {
    const t = tok.trim();
    if (!t) return;
    if (/[一-鿿]/.test(t)) {
      if (t.length === 1) terms.add(t);
      for (let i = 0; i < t.length - 1; i++) terms.add(t.slice(i, i + 2));
    } else if (t.length >= 2) terms.add(t);
  });
  return [...terms].sort((a, b) => b.length - a.length);
}
function highlight(textRaw, terms) {
  let h = esc(textRaw);
  if (!terms.length) return h;
  const re = new RegExp("(" + terms.map(escRe).join("|") + ")", "gi");
  return h.replace(re, "<mark>$1</mark>");
}

async function loadStats() {
  try {
    const d = await fetchJSON("/api/stats");
    buildChips(d.markets, d.total_reports);
    buildInstrumentChips(d.instrument_types || [], d.total_reports);
    buildSubjectToggles();
    buildTypeChips(d.report_types || [], d.total_reports);
  } catch (e) { $("#stats").innerHTML = `<span class="pill">後端未連線</span>`; }
}
function buildChips(markets, total) {
  const all = [{ market: "全部", count: total }, ...markets];
  $("#chips").innerHTML = all.map(m => {
    const isAll = m.market === "全部";
    const dot = isAll ? raw("") : html`<span class="dot" style="background:${mColor(m.market)}"></span>`;
    const nm = isAll ? "全部" : mLabel(m.market);
    return html`<button class="filter${m.market === state.market ? " on" : ""}" data-m="${m.market}" aria-pressed="${m.market === state.market}">
      ${dot}<span class="nm">${nm}</span><span class="ct">${m.count}</span></button>`;
  }).join("");
  $("#chips").querySelectorAll(".filter").forEach(c => c.onclick = () => {
    state.market = c.dataset.m;
    $("#chips").querySelectorAll(".filter").forEach(x => x.classList.toggle("on", x === c));
    rerun();
  });
}
function buildInstrumentChips(types, total) {
  const all = [{ type: "全部", count: total }, ...types];
  $("#instrChips").innerHTML = all.map(m => {
    const isAll = m.type === "全部";
    const dot = isAll ? raw("") : html`<span class="dot" style="background:${iColor(m.type)}"></span>`;
    const nm = isAll ? "全部" : iLabel(m.type);
    return html`<button class="filter${m.type === state.instrument ? " on" : ""}" data-i="${m.type}" aria-pressed="${m.type === state.instrument}">
      ${dot}<span class="nm">${nm}</span><span class="ct">${m.count}</span></button>`;
  }).join("");
  $("#instrChips").querySelectorAll(".filter").forEach(c => c.onclick = () => {
    state.instrument = c.dataset.i;
    $("#instrChips").querySelectorAll(".filter").forEach(x => x.classList.toggle("on", x === c));
    rerun();
  });
}
function buildSubjectToggles() {
  const defs = [{ key: "stock", label: "個股" }, { key: "futures", label: "期貨" }];
  $("#subjToggles").innerHTML = defs.map(d =>
    html`<button class="filter${(d.key === "stock" ? state.relStock : state.relFutures) ? " on" : ""}" data-s="${d.key}" aria-pressed="${d.key === "stock" ? state.relStock : state.relFutures}">
      <span class="nm">${d.label}</span></button>`).join("");
  $("#subjToggles").querySelectorAll(".filter").forEach(c => c.onclick = () => {
    const on = c.classList.toggle("on");
    if (c.dataset.s === "stock") state.relStock = on; else state.relFutures = on;
    rerun();
  });
}

// 報告類型詞表多為中文（雙週報/週報/月報/速報/策略/評析/報告）；英文者補中文顯示
const REPORT_TYPE_LABEL = { snapshot: "快照", memo: "備忘" };
const tLabel = t => REPORT_TYPE_LABEL[t] || t || "—";
function buildTypeChips(types, total) {
  const all = [{ type: "全部", count: total }, ...types];
  $("#typeChips").innerHTML = all.map(m => {
    const nm = m.type === "全部" ? "全部" : tLabel(m.type);
    return html`<button class="filter${m.type === state.type ? " on" : ""}" data-rt="${m.type}" aria-pressed="${m.type === state.type}">
      <span class="nm">${nm}</span><span class="ct">${m.count}</span></button>`;
  }).join("");
  $("#typeChips").querySelectorAll(".filter").forEach(c => c.onclick = () => {
    state.type = c.dataset.rt;
    $("#typeChips").querySelectorAll(".filter").forEach(x => x.classList.toggle("on", x === c));
    rerun();
  });
}

// 排序 chips：模式相依（search 多一個「相關度」）。若 state.sort 不在當前模式集合
// （只有 search 的 relevance → 切到 browse 會發生）就 reset 成該模式預設後再渲染。
function buildSortChips(mode) {
  const opts = mode === "search"
    ? [["relevance", "相關度"], ["date_desc", "日期新→舊"], ["date_asc", "日期舊→新"]]
    : [["date_desc", "日期新→舊"], ["date_asc", "日期舊→新"]];
  if (!opts.some(([v]) => v === state.sort)) state.sort = opts[0][0];
  $("#sortChips").innerHTML = opts.map(([v, label]) =>
    html`<button class="filter${v === state.sort ? " on" : ""}" data-sort="${v}" aria-pressed="${v === state.sort}">
      <span class="nm">${label}</span></button>`).join("");
  $("#sortChips").querySelectorAll(".filter").forEach(c => c.onclick = () => {
    state.sort = c.dataset.sort;
    $("#sortChips").querySelectorAll(".filter").forEach(x => x.classList.toggle("on", x === c));
    rerun();
  });
}

function skeleton() {
  $("#meta").classList.remove("show");
  $("#resultsBar").hidden = true;
  $("#results").className = "";
  $("#results").setAttribute("aria-busy", "true");   // 讀屏：宣告結果區載入中
  $("#results").innerHTML = Array.from({ length: 4 }, () =>
    `<div class="sk"><div class="sk-line" style="width:40%"></div>
     <div class="sk-line" style="width:92%"></div><div class="sk-line" style="width:76%"></div></div>`).join("");
}
function fmtDate(d) { return d ? d.replace(/-/g, "/") : null; }

// 標的徽章：base（個股/期貨）+ 標的清單。內嵌最多 3 個，超過顯示「首項 等 N<unit>」，完整清單放 title。
function subjTag(base, targets, unit) {
  const t = (targets || []).filter(Boolean);
  if (!t.length) return html`<span class="subj">${base}</span>`;
  const full = t.join("、");
  const shown = (unit && t.length > 3) ? `${t[0]} 等 ${t.length}${unit}` : full;
  const titleAttr = t.length > 3 ? html` title="${full}"` : raw("");  // 僅多檔縮寫時才補完整清單
  return html`<span class="subj"${titleAttr}>${base} · ${shown}</span>`;
}

function render(data) {
  state.rows = data.results || [];
  state.mode = "search";
  state.terms = buildTerms(data.query);
  state.tableSort = { key: null, dir: "asc" };
  $("#meta").classList.add("show");
  const mkt = data.market ? " · " + mLabel(data.market) : "";
  const capped = state.rows.length >= 12;   // k=12，達上限代表只取最相關的前幾篇
  $("#meta").textContent = `「${data.query}」${mkt} — 最相關的 ${state.rows.length} 篇研報`
    + (capped ? "（已達顯示上限，可加關鍵字縮小範圍）" : "");
  if (!state.rows.length) {
    $("#resultsBar").hidden = true;
    $("#results").className = "";
    const hasFilters = state.market !== "全部" || state.instrument !== "全部"
      || state.type !== "全部" || state.relStock || state.relFutures;
    $("#results").innerHTML = html`<div class="state"><div class="big" aria-hidden="true">🫧</div>
      <div class="msg">找不到「${data.query}」的相關研報，換個說法或關鍵字試試</div>
      <div class="examples">
        ${hasFilters ? html`<button class="ex" id="emptyClear" type="button">清除篩選再試</button>` : raw("")}
        <button class="ex" id="emptyBrowse" type="button">瀏覽全部報告</button>
      </div></div>`;
    const clr = $("#emptyClear");
    if (clr) clr.onclick = () => { resetFilters(); run(); };
    $("#emptyBrowse").onclick = () => {
      $("#q").value = ""; toggleClear(); state.lastQuery = ""; resetFilters(); loadBrowse();
    };
    return;
  }
  paintResults(true);
}

// ── 瀏覽模式：無關鍵字時列出全部已導入報告（日期新→舊，分頁）──
const BROWSE_PAGE = 50;

// ── 標籤列（商品類型 + 標的）共用 ──
function tagRowHtml(r) {
  const itags = (r.instrument_types || []).map(t =>
    html`<span class="itag" style="--ic:${iColor(t)}">${iLabel(t)}</span>`);
  const subj = [];
  if (r.relates_stock) subj.push(subjTag("個股", r.stock_targets, "檔"));
  if (r.relates_futures) subj.push(subjTag("期貨", r.futures_targets, ""));
  if (!itags.length && !subj.length) return raw("");
  return html`<div class="tags">${itags}${subj}</div>`;
}

// ── 摘要（卡片/列表共用，純文字無 emoji；點擊展開/收合，見 bindResultEvents）──
function summaryHtml(r, cls) {
  if (!r.summary) return raw("");
  return html`<span class="${cls} clamp">${r.summary}</span>`;
}

// ── 卡片（grid）：search 顯示排名/片段/相關度條；browse 為精簡版 ──
function gridCard(r, mode, i) {
  const c = mColor(r.market);
  const info = [];
  if (r.source) info.push(html`<span>${r.source}</span>`);
  if (r.report_date) info.push(html`<span>${fmtDate(r.report_date)}</span>`);
  if (r.report_type) info.push(html`<span>${r.report_type}</span>`);
  if (mode === "search") info.push(html`<span>${r.match_count} 命中片段</span>`);
  const tagRow = tagRowHtml(r);
  let body = raw(""), score = raw(""), rank = raw("");
  // 瀏覽模式整卡可點（不放按鈕，密度更高）；搜尋模式卡片非整卡可點，保留明確 CTA
  let actions = mode === "browse" ? raw("")
    : html`<button class="full-report" data-report-id="${r.report_id}">查看完整報告</button>`;
  if (mode === "search") {
    rank = html`<span class="rank">#${r.rank}</span>`;
    const pct = Math.max(4, Math.min(100, Math.round(r.best_score * 100)));
    const passHtml = (r.passages || []).map((p, pi) =>
      html`<div class="passage${pi > 0 ? " hidden" : ""}">
         <span class="pscore">${Math.round(p.score * 100)}%</span>${raw(highlight(p.content.slice(0, 300), state.terms))}…
       </div>`);
    body = html`<div class="passages">${passHtml}</div>`;
    const moreBtn = (r.passages || []).length > 1
      ? html`<button class="more" data-card="${i}">顯示其他 ${r.passages.length - 1} 段片段</button>` : raw("");
    actions = html`${moreBtn}${actions}`;
    score = html`<div class="score-row" title="分數＝本篇最相關片段與查詢的相似度，非整篇相關度">
        <div class="score-track"><div class="score-fill" data-w="${pct}"></div></div>
        <span class="score-num">${pct}%</span>
      </div>`;
  }
  const browseAttr = mode === "browse" ? html` data-report-id="${r.report_id}"` : raw("");
  return html`<div class="card${mode === "browse" ? " card-click" : ""}" style="animation-delay:${Math.min(i, 12) * 45}ms" data-card="${i}"${browseAttr}>
    <div class="card-top">
      <span class="badge" style="background:${c}">${mLabel(r.market)}</span>
      <span class="fname" title="${r.file_name}">${r.file_name}</span>
      ${rank}
    </div>
    ${info.length ? html`<div class="info">${joinHtml(info, '<span class="dot">·</span>')}</div>` : raw("")}
    ${tagRow}
    ${summaryHtml(r, "summary")}
    ${body}
    ${mode === "search" ? html`<div class="card-actions">${actions}</div>` : raw("")}
    ${score}
  </div>`;
}

// ── 緊湊列表列（list / group 共用），整列可點開完整報告 ──
function listRow(r, mode) {
  const c = mColor(r.market);
  const meta = [];
  if (r.source) meta.push(r.source);
  if (r.report_date) meta.push(fmtDate(r.report_date));
  if (r.report_type) meta.push(r.report_type);
  if (mode === "search") meta.push(`${r.match_count} 命中`);
  const scorePill = mode === "search"
    ? html`<span class="row-score">${Math.round((r.best_score || 0) * 100)}%</span>` : raw("");
  return html`<div class="row" data-report-id="${r.report_id}" title="${r.file_name}">
    <span class="badge" style="background:${c}">${mLabel(r.market)}</span>
    <span class="row-main">
      <span class="row-name">${r.file_name}</span>
      <span class="row-meta">${joinHtml(meta, '<span class="dot">·</span>')}</span>
      ${summaryHtml(r, "row-summary")}
      ${tagRowHtml(r)}
    </span>
    ${scorePill}
  </div>`;
}

// ── 表格：欄位可點擊做用戶端排序（僅作用於已載入資料）──
function targetsSummary(r) {
  const parts = [];
  if (r.relates_stock) {
    const t = (r.stock_targets || []).filter(Boolean);
    parts.push(t.length ? `個股 ${t.slice(0, 3).join("、")}${t.length > 3 ? "…" : ""}` : "個股");
  }
  if (r.relates_futures) {
    const t = (r.futures_targets || []).filter(Boolean);
    parts.push(t.length ? `期貨 ${t.slice(0, 3).join("、")}${t.length > 3 ? "…" : ""}` : "期貨");
  }
  return parts.length ? parts.join("　") : "—";   // 純文字，由 html`` 端自動跳脫
}
function sortedRows(rows) {
  if (!state.tableSort.key) return rows;
  const k = state.tableSort.key, dir = state.tableSort.dir === "asc" ? 1 : -1;
  const val = r => {
    switch (k) {
      case "name": return (r.file_name || "").toLowerCase();
      case "market": return mLabel(r.market);
      case "type": return tLabel(r.report_type);
      case "date": return r.report_date || "";
      case "source": return r.source || "";
      case "score": return r.best_score || 0;
      case "match": return r.match_count || 0;
      default: return "";
    }
  };
  return [...rows].sort((a, b) => {
    const va = val(a), vb = val(b);
    if (typeof va === "number") return (va - vb) * dir;
    return String(va).localeCompare(String(vb), "zh-Hant") * dir;
  });
}
function tableHtml(rows, mode) {
  const cols = [["name", "報告名稱"], ["market", "市場"], ["type", "類型"],
    ["date", "日期"], ["source", "來源"], [null, "標的"]];
  if (mode === "search") cols.push(["score", "相關度"], ["match", "命中"]);
  const head = cols.map(([key, label]) => {
    if (!key) return html`<th>${label}</th>`;
    const on = state.tableSort.key === key;
    const arrow = on ? (state.tableSort.dir === "asc" ? " ↑" : " ↓") : "";
    const aria = on ? (state.tableSort.dir === "asc" ? "ascending" : "descending") : "none";
    return html`<th class="sortable" data-sort-key="${key}" aria-sort="${aria}">${label}${arrow}</th>`;
  });
  const body = sortedRows(rows).map(r => {
    const cells = [
      html`<td class="t-name" title="${r.summary ? r.file_name + "\n\n" + r.summary : r.file_name}">${r.file_name}</td>`,
      html`<td><span class="badge" style="background:${mColor(r.market)}">${mLabel(r.market)}</span></td>`,
      html`<td>${r.report_type ? tLabel(r.report_type) : "—"}</td>`,
      html`<td class="t-date">${r.report_date ? fmtDate(r.report_date) : "—"}</td>`,
      html`<td>${r.source || "—"}</td>`,
      html`<td class="t-targets">${targetsSummary(r)}</td>`,
    ];
    if (mode === "search") {
      cells.push(html`<td class="t-num">${Math.round((r.best_score || 0) * 100)}%</td>`);
      cells.push(html`<td class="t-num">${r.match_count || 0}</td>`);
    }
    return html`<tr data-report-id="${r.report_id}">${cells}</tr>`;
  });
  return html`<table class="rtable"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

// ── 分組：依市場／報告類型／日期(月) 分組（僅作用於已載入資料）──
function groupKey(r, by) {
  if (by === "market") return r.market || "—";
  if (by === "report_type") return r.report_type || "—";
  if (by === "month") return r.report_date ? r.report_date.slice(0, 7) : "—";
  return "—";
}
function groupLabel(key, by) {
  if (key === "—") return "未分類";
  if (by === "market") return mLabel(key);
  if (by === "report_type") return tLabel(key);
  if (by === "month") return key.replace("-", "/");
  return key;
}
function groupedHtml(rows, mode, by) {
  const groups = new Map();
  rows.forEach(r => {
    const k = groupKey(r, by);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });
  const entries = [...groups.entries()];
  if (by === "month") entries.sort((a, b) => String(b[0]).localeCompare(String(a[0])));
  else entries.sort((a, b) => b[1].length - a[1].length);
  return joinHtml(entries.map(([k, rs]) => {
    const dot = (by === "market" && k !== "—")
      ? html`<span class="dot" style="background:${mColor(k)}"></span>` : raw("");
    return html`<section class="group">
      <div class="group-head">${dot}<span class="group-name">${groupLabel(k, by)}</span><span class="group-ct">${rs.length}</span></div>
      <div class="group-rows">${rs.map(r => listRow(r, mode))}</div>
    </section>`;
  }));
}

// ── 依目前 state.view 繪製快取結果；切換檢視不重打 API ──
function paintResults(animate = true) {
  const root = $("#results");
  root.className = "mode-" + state.view + (animate ? "" : " no-rise");
  $("#resultsBar").hidden = false;
  updateViewBar();
  let html;
  if (state.view === "table") html = tableHtml(state.rows, state.mode);
  else if (state.view === "group") html = groupedHtml(state.rows, state.mode, state.group);
  else if (state.view === "list") html = state.rows.map(r => listRow(r, state.mode)).join("");
  else html = state.rows.map((r, i) => gridCard(r, state.mode, i)).join("");
  root.innerHTML = html;
  appendLoadMore();
  bindResultEvents();
  root.removeAttribute("aria-busy");
  markClampable();   // 量測摘要是否真的溢出兩行，溢出才掛「展開」鈕
  if (state.view === "grid" && state.mode === "search") {
    const set = () => $$(".score-fill").forEach(f => f.style.width = f.dataset.w + "%");
    animate ? requestAnimationFrame(set) : set();
  }
}

function updateViewBar() {
  $$(".view-switch button").forEach(b => {
    const on = b.dataset.view === state.view;
    b.setAttribute("aria-checked", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;
  });
  $("#groupByWrap").hidden = state.view !== "group";
  const cf = $("#clearFilters");
  if (cf) { const n = activeFilterCount(); cf.hidden = !n; cf.textContent = n ? `清除篩選 · ${n}` : "清除篩選"; }
  let note = "";
  if ((state.view === "table" || state.view === "group")
      && state.mode === "browse" && state.offset < state.total) {
    note = `排序／分組僅套用已載入的 ${state.rows.length} 筆（共 ${state.total.toLocaleString()} 筆，可「載入更多」）`;
  }
  $("#viewNote").textContent = note;
}

function appendLoadMore() {
  if (state.mode !== "browse" || state.offset >= state.total) return;
  $("#results").insertAdjacentHTML("beforeend",
    `<div id="loadMoreWrap" class="load-more-wrap">
       <button class="more" id="loadMore">載入更多（還有 ${(state.total - state.offset).toLocaleString()} 篇）</button>
     </div>`);
}

// 結果區事件：整列開啟完整報告、展開片段、載入更多、表頭排序
function bindResultEvents() {
  const root = $("#results");
  root.querySelectorAll("[data-report-id]").forEach(el => {
    el.onclick = () => openFull(el.dataset.reportId);
    // 整列（list/group）、表格列、與瀏覽模式整卡都可用鍵盤開啟
    if (el.matches(".row, tr[data-report-id], .card.card-click")) {
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.onkeydown = e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openFull(el.dataset.reportId); }
      };
    }
  });
  root.querySelectorAll(".more[data-card]").forEach(btn => btn.onclick = () => {
    const card = root.querySelector(`.card[data-card="${btn.dataset.card}"]`);
    card.querySelectorAll(".passage.hidden").forEach(p => p.classList.remove("hidden"));
    btn.remove();
  });
  const lm = $("#loadMore");
  if (lm) lm.onclick = e => {
    e.target.disabled = true;
    e.target.textContent = "載入中…";   // 防連點重複請求 + 即時回饋
    loadBrowse(true);
  };
  // 表頭排序：滑鼠 + 鍵盤皆可（aria-sort 已標示，補上實際可操作性）
  root.querySelectorAll("th[data-sort-key]").forEach(th => {
    th.tabIndex = 0;
    th.setAttribute("role", "button");
    const doSort = () => {
      const key = th.dataset.sortKey;
      if (state.tableSort.key === key) state.tableSort.dir = state.tableSort.dir === "asc" ? "desc" : "asc";
      else { state.tableSort.key = key; state.tableSort.dir = "asc"; }
      paintResults(false);
    };
    th.onclick = doSort;
    th.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); doSort(); } };
  });
}

// 量測每則摘要是否真的被截斷（>2 行）；溢出才掛上鍵盤可用的「展開」鈕，
// 避免對只有一兩行的摘要顯示假的展開提示。每次 paint 後重跑（DOM 已重建）。
function markClampable() {
  $$("#results .summary, #results .row-summary").forEach(el => {
    if (el.scrollHeight <= el.clientHeight + 1) return;   // 沒溢出 → 不需要展開鈕
    el.classList.add("clampable");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "sum-toggle";
    btn.textContent = "展開";
    btn.setAttribute("aria-expanded", "false");
    btn.onclick = e => {
      e.stopPropagation();   // 在可點整列/整卡時不觸發開啟報告
      const open = el.classList.toggle("expanded");
      btn.textContent = open ? "收合" : "展開";
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    };
    el.insertAdjacentElement("afterend", btn);
  });
}

// 還原「載入更多」鈕（被點擊後會 disable + 改字）；用於 append 早退/失敗時避免卡在「載入中…」
function restoreLoadMore(label) {
  const lm = $("#loadMore");
  if (!lm) return;
  lm.disabled = false;
  lm.textContent = label || `載入更多（還有 ${(state.total - state.offset).toLocaleString()} 篇）`;
}

async function loadBrowse(append = false) {
  if (!append) {
    state.offset = 0;
    state.tableSort = { key: null, dir: "asc" };
    buildSortChips("browse");   // 先渲染（含 relevance→date_desc 的 reset），URL 才用到校正後的值
    syncURL();
    skeleton();
  }
  const my = ++state.browseReq;
  try {
    let url = `/api/reports?limit=${BROWSE_PAGE}&offset=${state.offset}`;
    if (state.market !== "全部") url += `&market=${encodeURIComponent(state.market)}`;
    if (state.instrument !== "全部") url += `&instrument_type=${encodeURIComponent(state.instrument)}`;
    if (state.relStock) url += "&relates_stock=true";
    if (state.relFutures) url += "&relates_futures=true";
    if (state.type !== "全部") url += `&report_type=${encodeURIComponent(state.type)}`;
    url += `&sort=${state.sort}`;
    const data = await fetchJSON(url);
    // 最新的 browse 才套用；若此時已有查詢，代表使用者意圖已切到搜尋 → 放棄這次 browse 結果
    if (my !== state.browseReq || $("#q").value.trim()) {
      if (append) restoreLoadMore();   // 還原按鈕，避免被棄用的載入更多卡在「載入中…」
      return;
    }
    state.mode = "browse";
    state.terms = [];
    state.rows = append ? state.rows.concat(data.items || []) : (data.items || []);
    state.total = data.total || 0;
    state.offset = state.rows.length;
    $("#meta").classList.add("show");
    const sortLabel = state.sort === "date_asc" ? "依日期舊到新" : "依日期新到舊";
    $("#meta").textContent = `已導入 ${state.total} 篇報告 — ${sortLabel}`;
    if (!state.total) {
      $("#resultsBar").hidden = true;
      $("#results").className = "";
      const hasFilters = state.market !== "全部" || state.instrument !== "全部"
        || state.type !== "全部" || state.relStock || state.relFutures;
      $("#results").innerHTML = html`<div class="state"><div class="big" aria-hidden="true">🫧</div>
        <div class="msg">這個篩選條件下沒有報告</div>
        ${hasFilters ? html`<div class="examples"><button class="ex" id="browseClear" type="button">清除篩選</button></div>` : raw("")}</div>`;
      const bc = $("#browseClear");
      if (bc) bc.onclick = () => { resetFilters(); loadBrowse(); };
      return;
    }
    paintResults(!append);   // 全量重繪快取結果；append 時不重播進場動畫
  } catch (e) {
    if (my !== state.browseReq) return;
    // 載入更多失敗：保留已顯示的結果，只還原按鈕讓使用者重試（不可清空整頁）
    if (append) { restoreLoadMore("載入更多（載入失敗，點擊重試）"); return; }
    $("#results").className = "";
    $("#results").removeAttribute("aria-busy");
    $("#results").innerHTML = html`<div class="state"><div class="big" aria-hidden="true">⚠️</div>
      <div class="msg">載入逾時或失敗，請稍後再試</div>
      <div class="examples"><button class="ex" id="retryBrowse" type="button">重試</button></div></div>`;
    const rb = $("#retryBrowse"); if (rb) rb.onclick = () => loadBrowse();
  }
}

async function run() {
  const q = $("#q").value.trim();
  if (!q) return;
  state.lastQuery = q;
  const my = ++state.searchReq;
  skeleton();
  buildSortChips("search");
  syncURL();
  try {
    let url = `/api/search?q=${encodeURIComponent(q)}&k=12&passages=4`;
    if (state.market !== "全部") url += `&market=${encodeURIComponent(state.market)}`;
    if (state.instrument !== "全部") url += `&instrument_type=${encodeURIComponent(state.instrument)}`;
    if (state.relStock) url += "&relates_stock=true";
    if (state.relFutures) url += "&relates_futures=true";
    if (state.type !== "全部") url += `&report_type=${encodeURIComponent(state.type)}`;
    url += `&sort=${state.sort}`;
    const data = await fetchJSON(url);
    // 最新的 search 才套用；若查詢已被清空，代表意圖切回瀏覽 → 放棄這次 search 結果
    if (my === state.searchReq && $("#q").value.trim()) render(data);
  } catch (e) {
    if (my === state.searchReq) {
      $("#results").className = "";
      $("#results").removeAttribute("aria-busy");
      $("#results").innerHTML = html`<div class="state"><div class="big" aria-hidden="true">⚠️</div>
        <div class="msg">查詢逾時或失敗，請稍後再試</div>
        <div class="examples"><button class="ex" id="retrySearch" type="button">重試</button></div></div>`;
      const rb = $("#retrySearch"); if (rb) rb.onclick = () => run();
    }
  }
}

function toggleClear() { $("#clear").classList.toggle("show", !!$("#q").value); }

let debounceT;
$("#q").addEventListener("input", () => {
  toggleClear();
  clearTimeout(debounceT);
  const v = $("#q").value.trim();
  if (!v) { if (state.lastQuery) { state.lastQuery = ""; loadBrowse(); } return; }
  if (v.length < 2) return;
  debounceT = setTimeout(() => { if (v !== state.lastQuery) run(); }, 450);
});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(debounceT); run(); } });
$("#go").onclick = () => { clearTimeout(debounceT); run(); };
$("#clear").onclick = () => { $("#q").value = ""; toggleClear(); state.lastQuery = ""; $("#q").focus(); loadBrowse(); };
document.querySelectorAll("#examples .ex").forEach(b => b.onclick = () => {
  clearTimeout(debounceT);   // 與 #go/Enter 一致，避免 debounce timer 觸發冗餘查詢
  $("#q").value = b.textContent; toggleClear(); run();
});

// ── 完整報告 modal ──
let lastFocused = null;
function trapTab(e) {
  if (e.key !== "Tab") return;
  const modal = document.querySelector(".modal");
  const f = modal.querySelectorAll('a[href],button:not([disabled]),iframe,[tabindex]:not([tabindex="-1"])');
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
async function openFull(id) {
  const back = $("#modalBackdrop");
  $("#modalName").textContent = "載入中…";
  $("#modalMeta").innerHTML = "";
  const msum = $("#modalSummary");
  msum.textContent = ""; msum.hidden = true;
  $("#modalBody").textContent = "";
  $("#modalFoot").innerHTML = "";
  lastFocused = document.activeElement;       // 記住觸發按鈕，關閉時還原焦點
  back.classList.add("open");
  document.body.style.overflow = "hidden";   // 鎖背景捲動
  $("#modalClose").focus();
  document.addEventListener("keydown", trapTab);
  try {
    const d = await fetchJSON(`/api/report/${id}/full`);
    const meta = [];
    if (d.market) meta.push(html`<span class="badge" style="background:${mColor(d.market)}">${mLabel(d.market)}</span>`);
    if (d.source) meta.push(html`<span>${d.source}</span>`);
    if (d.report_date) meta.push(html`<span>${fmtDate(d.report_date)}</span>`);
    if (d.report_type) meta.push(html`<span>${d.report_type}</span>`);
    $("#modalName").textContent = d.file_name || "";
    $("#modalMeta").innerHTML = meta.join('<span class="dot">·</span>');
    if (d.summary) { msum.textContent = d.summary; msum.hidden = false; }
    const fileUrl = `/api/report/${id}/file`;
    const isPdf = (d.file_name || "").toLowerCase().endsWith(".pdf");
    if (d.has_file && isPdf) {
      // PDF 常數 MB，內網下要數秒；先顯示載入中覆蓋層，iframe load 後移除，避免整片深灰無回饋
      $("#modalBody").innerHTML = html`<div class="pdf-wrap">
          <div class="pdf-loading" id="pdfLoading"><span class="spin"></span>報告載入中…</div>
          <iframe class="pdf-frame" src="${fileUrl}" title="完整報告"></iframe>
        </div>`;
      const frame = $("#modalBody iframe"), ld = $("#pdfLoading");
      frame.onload = () => { if (ld) ld.remove(); };
      frame.onerror = () => { if (ld) ld.textContent = "無法預覽，請改用下方「在新分頁開啟」"; };
      $("#modalFoot").innerHTML = html`<a href="${fileUrl}" target="_blank" rel="noopener">在新分頁開啟</a>`;
    } else if (d.has_file) {
      const ext = (d.file_name.split(".").pop() || "").toUpperCase();
      $("#modalBody").innerHTML = html`<div class="modal-fallback">此檔為 ${ext} 文件，無法內嵌預覽，請下載查看。</div>`;
      $("#modalFoot").innerHTML = html`<a href="${fileUrl}" target="_blank" rel="noopener">下載原始檔</a>`;
    } else {
      $("#modalBody").innerHTML = `<div class="modal-fallback">找不到原始檔。</div>`;
      $("#modalFoot").innerHTML = "";
    }
  } catch (e) {
    $("#modalName").textContent = "載入失敗";
    $("#modalBody").innerHTML = `<div class="modal-fallback">報告載入失敗，請稍後再試或重新整理頁面。</div>`;
  }
}
function closeFull() {
  document.removeEventListener("keydown", trapTab);
  $("#modalBackdrop").classList.remove("open");
  $("#modalBody").innerHTML = "";
  document.body.style.overflow = "";          // 還原背景捲動
  if (lastFocused && lastFocused.focus) lastFocused.focus();
  lastFocused = null;
}
$("#modalClose").onclick = closeFull;
$("#modalBackdrop").addEventListener("click", e => { if (e.target === e.currentTarget) closeFull(); });
// Escape 僅在 modal 開啟時才關閉，避免攔截頁面其他 Escape 用途
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modalBackdrop").classList.contains("open")) closeFull();
});

$("#filterToggle").onclick = () => {
  const open = $("#filterGroups").classList.toggle("open");
  $("#filterToggle").setAttribute("aria-expanded", open ? "true" : "false");
};
// 常駐「清除篩選」：套用篩選時隨時可一鍵還原（不必篩到 0 筆才出現）
const clearFiltersBtn = $("#clearFilters");
if (clearFiltersBtn) clearFiltersBtn.onclick = () => { resetFilters(); rerun(); };

// 篩選 chip 的 aria-pressed 與 .on 視覺狀態同步（事件委派，撐過 innerHTML 重建）
function syncPressed(sel) {
  document.querySelectorAll(sel + " .filter").forEach(x =>
    x.setAttribute("aria-pressed", x.classList.contains("on")));
}
["#chips", "#instrChips", "#subjToggles", "#typeChips", "#sortChips"].forEach(sel =>
  document.querySelector(sel).addEventListener("click", () => syncPressed(sel)));

// ── 檢視切換（卡片／列表／表格／分組）：切換不重打 API，只重繪快取結果 ──
$$(".view-switch button").forEach(b => b.onclick = () => {
  if (state.view === b.dataset.view) return;
  state.view = b.dataset.view;
  try { localStorage.setItem("rm_view", state.view); } catch (e) {}
  syncURL();
  state.rows.length ? paintResults(false) : updateViewBar();
});
$(".view-switch").addEventListener("keydown", e => {   // radiogroup 方向鍵切換
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  e.preventDefault();
  const idx = VIEWS.indexOf(state.view);
  const next = e.key === "ArrowRight" ? (idx + 1) % VIEWS.length : (idx - 1 + VIEWS.length) % VIEWS.length;
  const btn = $(`.view-switch button[data-view="${VIEWS[next]}"]`);
  btn.click(); btn.focus();
});
$("#groupBy").onchange = () => {
  state.group = $("#groupBy").value;
  syncURL();
  if (state.rows.length && state.view === "group") paintResults(false);
};

loadStats();
const hadQuery = restoreFromURL();   // 從 URL 還原狀態（可分享／可重整）
$("#groupBy").value = state.group;        // 反映還原後的分組依據
if (hadQuery) run(); else loadBrowse();
</script>
</body>
</html>
