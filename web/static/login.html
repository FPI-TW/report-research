<style>
  /* 登入頁在 auth 牆外，不可引用 /static 下受保護資產（tokens.css）；樣式全部 inline。
     色值與圓角是 frontend/src/styles/tokens.css 的手抄副本——改主題時兩邊都要動。
     字體改走系統無襯線後不再需要 Google Fonts，連帶省掉 auth 牆外的兩個外部連線。 */
  :root {
    --gold: #8a5a0f; --gold-hover: #7a4f0c;
    --canvas: #f2f2f4; --surface: #ffffff; --border: #e3e3e6;
    --text-1: #1d1d1f; --text-2: #48484d; --text-3: #6b6b70; --text-4: #8e8e93;
    --glass: rgba(255,255,255,.72); --glass-border: rgba(0,0,0,.07);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "PingFang TC",
                 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  @media (prefers-reduced-transparency: reduce) {
    :root { --glass: #fff; }
  }
  * { box-sizing: border-box; }
  /* 全站唯一一處讓磨砂玻璃「以卡片形式」出現的地方：登入卡底下確實有東西
     （氛圍暈染層），模糊才讀得出材質。應用內的卡片一律實白，見 tokens.css 的說明。 */
  body {
    margin: 0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    background:
      radial-gradient(900px 620px at 18% 8%, rgba(174,116,21,.10), transparent 62%),
      radial-gradient(760px 520px at 84% 92%, rgba(44,44,46,.07), transparent 60%),
      var(--canvas);
    color: var(--text-1); padding: 24px;
  }
  .card {
    width: 360px; max-width: 100%;
    background: var(--glass);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-radius: 20px;
    box-shadow: 0 0 0 .5px var(--glass-border), 0 12px 40px rgba(0,0,0,.10),
                inset 0 1px 0 rgba(255,255,255,.65);
    padding: 36px 32px;
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 26px; }
  .glyph { display: block; width: 56px; height: 56px; }
  .name { font-weight: 600; font-size: 21px; letter-spacing: -.01em; color: var(--text-1); }
  .tagline { font-size: 12.5px; color: var(--text-3); }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-2); margin: 0 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 14px; color: var(--text-1);
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface); outline: none;
  }
  input#username { margin-bottom: 14px; }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3.5px rgba(138,90,15,.12); }
  button {
    width: 100%; margin-top: 18px; padding: 10px 0; font-size: 14px; font-weight: 600;
    color: #fff; background: var(--gold); border: none; border-radius: 999px; cursor: pointer;
  }
  button:hover { background: var(--gold-hover); }
  .error {
    display: none; margin-top: 12px; padding: 8px 11px; font-size: 12.5px;
    color: #a3322a; background: #fdf2f1; border: 1px solid #f0cac6; border-radius: 10px;
  }
  .hint { margin-top: 16px; text-align: center; font-size: 11.5px; color: var(--text-4); }
</style>
